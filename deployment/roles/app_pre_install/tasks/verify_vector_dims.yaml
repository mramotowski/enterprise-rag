---
# Included from load_settings.yaml and, with projected Secrets (the lookup runs
# as an in-cluster Job), from install.yaml after that Job.
#
# An empty vector_databases_vector_dims in config.yaml arrives as an extra var,
# which outranks the set_fact of the lookup — detection runs but its result can never be
# applied, and the empty string would render into the Helm values. Only an assert
# catches that, so fail here rather than build an unusable index.
- name: "app_pre_install | Verify vector_dims is a positive integer"
  ansible.builtin.assert:
    that:
      - vector_databases_vector_dims | default(0, true) | int > 0
    fail_msg: >-
      vector_databases_vector_dims is '{{ vector_databases_vector_dims | default('<unset>') }}',
      which is not a usable vector dimension. Either remove the key from
      config.yaml entirely to auto-detect it from the embedding model, or set it
      to a positive integer. Leaving it blank does not mean "auto".
    success_msg: "vector_databases_vector_dims={{ vector_databases_vector_dims }} (source: {{ vector_databases_vector_dims_source | default('pending', true) }})"
