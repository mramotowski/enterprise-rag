---
- name: "app_pre_install | Load solution configuration"
  ansible.builtin.include_tasks:
    file: solution_config.yaml

# Treats undefined, "" and 0 alike as "not set". Single reference to the var, so
# there is no short-circuit ordering to get right, and | string keeps | length
# from raising on an int.
- name: "app_pre_install | Check whether vector_dims was pinned in config"
  ansible.builtin.set_fact:
    _vector_dims_explicit: "{{ vector_databases_vector_dims | default('', true) | string | length > 0 }}"

# With projected Secrets the lookup needs the HF token, which only an in-cluster
# Job may read: install.yaml runs it after the credential store is opened.
- name: "app_pre_install | Resolve vector_dims from embedding model"
  ansible.builtin.include_tasks:
    file: resolve_vector_dims.yaml
  when:
    - not (_vector_dims_explicit | bool)
    - not (app_secrets_projected | default(false))

# Detection never ran, so record why rather than leaving the summary at 'pending'.
- name: "app_pre_install | Record explicitly configured vector_dims"
  ansible.builtin.set_fact:
    vector_databases_vector_dims_source: "explicit_config"
  when: _vector_dims_explicit | bool

- name: "app_pre_install | Verify vector_dims"
  ansible.builtin.include_tasks:
    file: verify_vector_dims.yaml
  when: (_vector_dims_explicit | bool) or not (app_secrets_projected | default(false))

- name: "app_pre_install | Validate mcp_enabled"
  ansible.builtin.include_tasks:
    file: validate_mcp_enabled.yaml

- name: "app_pre_install | Verify configuration"
  ansible.builtin.include_tasks:
    file: verify_config.yaml

- name: "app_pre_install | Display configuration summary"
  ansible.builtin.debug:
    msg: |

      ==================== CONFIGURATION SUMMARY ====================

      CONFIGURATION SUCCESSFUL

      All configuration checks passed successfully!

      Pipeline Configuration:
        • Type: {{ pipeline_type | default('undefined') }}
        • Variant: {{ pipeline_variant | default('base') }}{{ ' (upload mode: embedding only, no chat)' if (pipeline_variant | default('base')) == 'upload' else '' }}

      Environment Configuration:
      {% if app_secrets_projected | default(false) %}
        • hugging_token: read from OpenBao erag/user/hf-token (checked once the store is opened)
      {% else %}
        • hugging_token: {{ 'SET' if hugging_token is defined and hugging_token != '' else 'NOT SET (ensure models are publicly available)' }}
      {% endif %}

      Proxy Configuration:
      {% if http_proxy is defined and http_proxy != '' %}
        • HTTP Proxy: {{ http_proxy }}
      {% endif %}
      {% if https_proxy is defined and https_proxy != '' %}
        • HTTPS Proxy: {{ https_proxy }}
      {% endif %}
      {% if no_proxy is defined and no_proxy != '' %}
        • Combined NoProxy: {{ no_proxy }}
      {% endif %}
      {% if additional_no_proxy is defined and additional_no_proxy != '' %}
        • User Additional NoProxy: {{ additional_no_proxy }}
      {% endif %}
      {% if (http_proxy is not defined or http_proxy == '') and (https_proxy is not defined or https_proxy == '') %}
        • Proxy: Not configured
      {% endif %}

      Domain Configuration:
        • UI: {{ base_domain_name | default('undefined') }}
        • Keycloak: {{ erag_keycloak_domain_name | default('undefined') }}
        • Telemetry: {{ telemetry_domain_name | default('undefined') }}
      {% if edp_enabled | default(false) | bool %}
        • EDP Storage: {{ edp_storage_type | default('seaweedfs') }}
        {% if edp_storage_type | default('seaweedfs') == 'seaweedfs' %}
        • EDP Browser: {{ edp_minio_domain_name | default('undefined') }}
        • EDP S3 API: {{ edp_minio_api_domain_name | default('undefined') }}
        {% endif %}
      {% endif %}

      TLS Configuration:
        • Managed by cert-manager in ai-solutions (gateway_tls_mode)

      Services Status:
        • Istio: {{ istio_enabled | default('undefined') }}
        • Keycloak: {{ keycloak_enabled | default('undefined') }}
        • APISIX: {{ apisix_enabled | default('undefined') }}
        • Vector DB: {{ vector_databases_enabled | default('undefined') }}
        • EDP: {{ edp_enabled | default('undefined') }}
      {% if edp_enabled | default(false) | bool %}
        • Late Chunking: {{ edp_late_chunking_enabled | default(false) }}
      {% endif %}
        • UI: {{ ui_enabled | default('undefined') }}
        • Telemetry: {{ telemetry_enabled | default('undefined') }}

      Image Configuration:
        • Registry: {{ registry | default('undefined') }}
        • Tag: {{ tag | default('undefined') }} ({{ tag_source | default('configured') }}{{ ', tag_override active' if tag_override | default(false) | bool else '' }})

      Model Configuration:
        • LLM Model: {{ llm_model_name | default('undefined') }}
        • Embedding Model: {{ embedding_model_name | default('undefined') }} ({{ embedding_model_id | default('undefined') }})
        • Reranking Model: {{ reranking_model_name | default('undefined') }}
        • Vector Dims: {{ vector_databases_vector_dims | default('auto', true) }} (source: {{ vector_databases_vector_dims_source | default('pending', true) }})


      Ready to proceed with deployment!
      ============================================================
  when: configuration_issues | length == 0
