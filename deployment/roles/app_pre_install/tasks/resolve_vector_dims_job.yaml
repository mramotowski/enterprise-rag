---
# vector_dims lookup with projected Secrets (ARCHITECTURE-SPINE AD-3): the HF token may
# not reach the installer host, so files/resolve_vector_dims.py runs as a Job
# (app_script_job) in the credential-store namespace and reads the projected hf-token
# with --hf-token-env (never in argv, the manifest or the log). Included from
# install.yaml when vector_databases_vector_dims is unset.

- name: "app_pre_install | vector_dims Job | Locate the script"
  ansible.builtin.set_fact:
    _vector_dims_script: "{{ role_path }}/files/resolve_vector_dims.py"

- name: "app_pre_install | vector_dims Job | Run the lookup"
  ansible.builtin.include_role:
    name: app_script_job
    tasks_from: run.yaml
  vars:
    script_job_prefix: erag-vector-dims
    script_job_namespace: "{{ vector_dims_job_namespace }}"
    script_job_part_of: erag-secrets
    script_job_component: vector-dims
    script_job_managed_by: app_pre_install
    script_job_script: "{{ _vector_dims_script }}"
    script_job_image: "{{ vector_dims_job_image }}"
    script_job_timeout: "{{ vector_dims_job_timeout }}"
    script_job_poll_delay: "{{ vector_dims_job_poll_delay }}"
    script_job_result_regex: '^[{].*"vector_dims": *[0-9]+'
    script_job_args: >-
      {{ ['--embedding-model-id', embedding_model_id | string]
         + (['--offline'] if offline_model | default(false) | bool else [])
         + ['--hf-token-env', 'HF_TOKEN', '--fallback-dims', vector_databases_vector_dims | default(768, true) | int | string] }}
    # The token ref is required when the token is in the store (no anonymous lookup
    # and wrong fallback on a missing projection); else optional (anonymous lookup).
    script_job_env: >-
      {%- set out = [{'name': 'HF_TOKEN', 'secret': 'hf-token', 'key': 'token',
                      'optional': not (hugging_token_projected | default(false) | bool)}] -%}
      {%- for name in ['http_proxy', 'https_proxy', 'no_proxy']
            if lookup('ansible.builtin.vars', name, default='') | string | length > 0 -%}
        {%- set _ = out.extend([{'name': name, 'value': lookup('ansible.builtin.vars', name) | string},
                                {'name': name | upper, 'value': lookup('ansible.builtin.vars', name) | string}]) -%}
      {%- endfor -%}
      {{ out }}
    script_job_isolated: false    # as on the host (no python3 -I)
    script_job_ttl: 86400
    script_job_resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
    # Kept after the run for the kubectl commands of the failure message.
    script_job_cleanup: false

- name: "app_pre_install | vector_dims Job | Fail when the Job gave no result"
  ansible.builtin.fail:
    msg: >-
      app_pre_install | the vector_dims Job {{ vector_dims_job_namespace }}/{{ script_job_name }}
      {{ script_job_reason }} (image {{ vector_dims_job_image }}). Check:
      kubectl -n {{ vector_dims_job_namespace }} describe job {{ script_job_name }};
      kubectl -n {{ vector_dims_job_namespace }} logs job/{{ script_job_name }}
      (the Job never logs the token). Or set vector_databases_vector_dims in the configuration
      to skip the lookup.
  when: script_job_reason | length > 0

- name: "app_pre_install | vector_dims Job | Apply the detected vector_dims"
  ansible.builtin.set_fact:
    vector_databases_vector_dims: "{{ script_job_result.vector_dims | int }}"
    vector_databases_vector_dims_source: "{{ script_job_result.source }}"

- name: "app_pre_install | vector_dims Job | Show the result"
  ansible.builtin.debug:
    msg: >-
      vector_databases_vector_dims={{ vector_databases_vector_dims }} for model
      '{{ embedding_model_id }}' (source: {{ vector_databases_vector_dims_source }}, in-cluster Job
      {{ vector_dims_job_namespace }}/{{ script_job_name }}{{ ', HF token from OpenBao'
      if hugging_token_projected | default(false) | bool else ', no HF token' }})
      {{ script_job_warnings | join(' ') }}
