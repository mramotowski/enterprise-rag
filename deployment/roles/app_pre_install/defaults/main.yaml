---
# Defaults for app_pre_install. Override in deployment/config.yaml or via -e.
app_pre_install_namespace: "pre_install"

# --- RAG-scoped work dirs (subdirs of the shared log_dir/tmp_dir owned by core
#     site.yaml). All .rag-generated artifacts live here so teardown can wipe
#     the whole tree without touching core-owned files. ---
rag_log_dir: "{{ log_dir }}/rag"
rag_tmp_dir: "{{ tmp_dir }}/rag"

# --- Cross-role shared defaults - consumed by resolve_vector_dims and solution_config. ---
# *_model_name is the catalog/served name; embedding_model_id is the HF repo id.
llm_model_name: ""                                 # app_inference_models
embedding_model_name: ""                           # app_inference_models
embedding_model_id: ""                             # app_inference_models
reranking_model_name: ""                           # app_inference_models
# vector_databases_vector_dims is deliberately NOT declared here: unset means
# "auto-detect", and load_settings.yaml keys the detection gate off that.

# --- vector_dims lookup as an in-cluster Job (projected Secrets, i.e. the
#     OpenBao backend; tasks/resolve_vector_dims_job.yaml). Runs files/resolve_vector_dims.py
#     in the credential-store namespace, where the HF token is projected. ---
vector_dims_job_image: "docker.io/library/python:3.12-slim"
# The namespace of the registry projection <erag_secrets_namespace>/hf-token
# (app_secrets files/registry.yaml); not a separate setting.
vector_dims_job_namespace: "{{ erag_secrets_namespace | default('erag-secrets') }}"
vector_dims_job_timeout: 300                       # seconds the Job may run
vector_dims_job_poll_delay: 5

# --- Teardown: every credential of the app_secrets registry (files/registry.yaml),
#     one ID per variant. Deleting all of them is the layer teardown: with the
#     OpenBao backend it also removes what else is stored under <cluster_id>/erag/,
#     the ExternalSecrets and the namespace labels (tasks/teardown.yaml).
#     app_secrets tests/openbao_cases.yaml fails when this list and the registry differ. ---
app_pre_install_teardown_secret_ids:
  - keycloak/erag-admin
  - keycloak/erag-user
  - keycloak/erag-maintainer
  - keycloak/mcp-client
  - keycloak/grafana-oauth
  - keycloak/edp-oidc
  - nats/auth
  - vector-db/redis
  - vector-db/pgvector
  - vector-db/mssql
  - chat-history/postgres
  - fingerprint/postgres
  - edp/postgresql
  - edp/redis
  - edp/object-store
  - seaweedfs/admin
  - user/edp-s3
  - user/sharepoint
  - user/keycloak-oidc
  - user/ldap-bind
  - user/hf-token

# --- Rotation (AD-9): es_auto_installer.sh install erag --env <env> --only --
#     -e erag_rotate=[<id>,...] is a rotate-only run. erag_rotate is a list of app_secrets credential ids
#     (-e '{"erag_rotate": [...]}') or the string "[<id>,<id>]" that
#     -e erag_rotate=[...] passes. When it is set, deployment/components.yaml
#     disables every erag component but this one, and tasks/install.yaml runs
#     only app_secrets rotate (tasks/rotate.yaml). Install action only: a
#     teardown, upgrade or validate ignores erag_rotate. ---
erag_rotate: []
app_pre_install_rotate_run: "{{ erag_rotate | default([]) | length > 0 and (component_action | default('install')) == 'install' }}"
app_pre_install_rotate_ids: >-
  {{ (erag_rotate if (erag_rotate is sequence and erag_rotate is not string)
      else (erag_rotate | string | regex_replace('[][ ]', '') | replace('"', '') | replace("'", '')).split(','))
     | map('string') | map('trim') | reject('equalto', '') | list }}

# --- Migration of a local-mode env to the OpenBao backend (tasks/install.yaml):
#     every credential of the app_secrets registry that has a legacy Secret
#     (operator entries under erag/user/ have none). app_post_install finalizes
#     with the same list (app_post_install_import_secret_ids);
#     app_secrets tests/test_migration.yaml fails when either list and the registry differ. ---
app_pre_install_import_secret_ids:
  - keycloak/erag-admin
  - keycloak/erag-user
  - keycloak/erag-maintainer
  - keycloak/mcp-client
  - keycloak/grafana-oauth
  - keycloak/edp-oidc
  - nats/auth
  - vector-db/redis
  - vector-db/pgvector
  - vector-db/mssql
  - chat-history/postgres
  - fingerprint/postgres
  - edp/postgresql
  - edp/redis
  - edp/object-store
  - seaweedfs/admin

# --- Cross-role shared defaults - derived from base_domain_name in tasks/solution_config.yaml; declared here for standalone runs. ---
ui_domain_name: "solutions.ai"                                                       # app_ui
erag_keycloak_domain_name: "auth.solutions.ai"                                        # app_keycloak_config
erag_keycloak_path_prefix: ""                                                     # app_keycloak_config
erag_keycloak_default_path_prefix: "/auth"                                        # app_keycloak_config
edp_minio_domain_name: "seaweedfs.{{ base_domain_name | default('solutions.ai') }}"  # app_edp
edp_minio_api_domain_name: "s3.{{ base_domain_name | default('solutions.ai') }}"     # app_edp
edp_seaweedfs_path_prefix: ""                                                    # app_edp
routing_mode: subdomain                            # solution_config (subdomain | path)
secure_logs: true                                  # global

# --- Cross-role shared defaults - consumed by validate_mcp_enabled.yaml. ---
mcp_enabled: false                                 # set per flavour in pipelines/<flavour>/config.yaml
pipeline_type: "chatqna"                           # app_pipeline
pipeline_variant: "base"                           # app_pipeline
# Referenced by chatqna/pipeline.yaml's endpoints block, which the composer run in
# validate_mcp_enabled.yaml renders. app_inference_models sets the real value first in a
# full install; the empty default only keeps a standalone run from failing, and the
# precondition check does not read the URL.
llm_endpoint: ""                                   # app_inference_models
# --- Cross-role shared defaults - consumed by the app_data_consistency snapshot that
#     this role includes on the upgrade path. Another role's defaults are not in scope
#     while this one runs, so the values it queries are declared here against their
#     owning role. ---
vector_databases_namespace: "vdb"                    # app_vector_databases
vector_databases_helm_release_name: "vdb"            # app_vector_databases
vector_databases_vector_store: "redis-cluster"       # app_vector_databases (redis-cluster | mssql | pgvector)
chat_history_namespace: "chat-history"               # app_chat_history
chat_history_helm_release_name: "chat-history"       # app_chat_history
edp_namespace: "edp"                                 # app_edp
edp_helm_release_name: "edp"                         # app_edp
keycloak_namespace: "keycloak"                       # app_keycloak_config
keycloak_admin_secret_name: "keycloak-admin-secret"  # app_keycloak_config
keycloak_statefulset_pod: "keycloak-0"               # keycloak, platform layer
erag_keycloak_realm: "EnterpriseRAG"                 # app_keycloak_config

# Owned by nothing else: the Redis secret the vector store's chart creates, the
# container to exec into, and the stores the snapshot knows how to count.
data_snapshot_vdb_secret_name: "redis-cluster-secret"
data_snapshot_vdb_container: "redis"
data_snapshot_redis_stores: ["redis", "redis-cluster"]
