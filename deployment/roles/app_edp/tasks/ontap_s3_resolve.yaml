---
# Derives every ONTAP S3 setting from the storage backend parameters the operator
# already provided for Trident. Facts only - no cluster calls, so this file is
# safe under --check and usable with no array present.

# Normally already done by app_pre_install; repeated for a standalone
# 'install app_edp --only' and for validate runs, which is also where
# _edp_storage_backend and _edp_ontap_s3_lif come from.
- name: "app_edp | ONTAP S3 | Derive the storage type from the ONTAP S3 parameters"
  ansible.builtin.include_tasks:
    file: ontap_s3_derive.yaml
  when: _edp_ontap_s3_lif is not defined

- name: "app_edp | ONTAP S3 | Resolve the endpoint port and upstream TLS mode"
  ansible.builtin.set_fact:
    _edp_ontap_s3_port: "{{ ontap_s3_port | default(443) | int }}"
    _edp_ontap_s3_tls_mode: >-
      {{ 'plaintext' if not (ontap_s3_tls | default(true) | bool)
         else edp_ontap_s3_tls_mode | default('insecure') }}

# ontap_s3_data_lif is the ONTAP S3 endpoint and nothing else, so its presence is
# an unambiguous request for the proxy. ontap_data_lif is the NFS LIF and
# s3compatible is a generic backend, so neither may activate anything on its own:
# that combination also describes a Trident cluster whose object store is somebody
# else's MinIO.
- name: "app_edp | ONTAP S3 | Resolve reverse proxy activation"
  ansible.builtin.set_fact:
    _edp_ontap_s3_active: >-
      {{ (edp_ontap_s3_reverse_proxy | string | trim | length > 0)
         | ternary(edp_ontap_s3_reverse_proxy | default(false) | bool,
                   (_edp_ontap_s3_lif | length > 0)
                   and (_edp_storage_backend == 'netapp-trident')
                   and _edp_ontap_s3_requested) }}
    _edp_ontap_s3_lif_is_ipv4: "{{ _edp_ontap_s3_lif is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$') }}"
  vars:
    _edp_ontap_s3_requested: >-
      {{ (edp_storage_type | default('seaweedfs') == 's3compatible')
         or (edp_s3_compatible_access_key_id | default('', true) | string | trim | length > 0) }}

- name: "app_edp | ONTAP S3 | Report unused ONTAP storage parameters"
  ansible.builtin.debug:
    msg: >-
      Storage backend is netapp-trident but EDP keeps using '{{ edp_storage_type }}'. To
      serve documents from ONTAP S3, set ontap_s3_data_lif plus
      edp_s3_compatible_access_key_id / edp_s3_compatible_secret_access_key; everything
      else is derived. See docs/netapp_ontap_s3.md.{{ ' With projected Secrets (OpenBao) the
      keys go to OpenBao erag/user/edp-s3 (access_key_id, secret_access_key) instead, and
      edp_storage_type: s3compatible must be set explicitly (the derivation keys on the
      config access key).' if app_secrets_projected | default(false) else '' }}
  when:
    - not (_edp_ontap_s3_active | bool)
    - _edp_storage_backend == 'netapp-trident'

- name: "app_edp | ONTAP S3 | Derive configuration"
  when: _edp_ontap_s3_active | bool
  block:
    - name: "app_edp | ONTAP S3 | Assert an ONTAP S3 endpoint is configured"
      ansible.builtin.assert:
        that: _edp_ontap_s3_lif | length > 0
        fail_msg: >-
          edp_ontap_s3_reverse_proxy is true but neither ontap_s3_data_lif nor
          ontap_data_lif is set. The proxy needs the address the ONTAP object-store
          server answers on; set ontap_s3_data_lif in env/<name>/global_config.yaml,
          or set edp_ontap_s3_reverse_proxy: false.
        success_msg: "app_edp: ONTAP S3 endpoint {{ _edp_ontap_s3_lif }}:{{ _edp_ontap_s3_port }}"
        quiet: true

    # A hostname works in 'insecure' mode, where the gateway routes through the
    # envoy-gateway Backend and its endpoints[].fqdn. The other two modes route
    # through the selectorless Service, whose EndpointSlice is addressType IPv4 and
    # rejects a name.
    - name: "app_edp | ONTAP S3 | Assert the data LIF is a literal IPv4 address"
      ansible.builtin.assert:
        that: _edp_ontap_s3_lif_is_ipv4 | bool
        fail_msg: >-
          The ONTAP S3 endpoint is '{{ _edp_ontap_s3_lif }}'. In
          '{{ _edp_ontap_s3_tls_mode }}' mode the reverse proxy routes through the
          selectorless Service '{{ edp_ontap_s3_backend_name }}', whose EndpointSlice is
          addressType IPv4 and cannot hold a hostname. Resolve the name and set the
          address in ontap_s3_data_lif, or use edp_ontap_s3_tls_mode: insecure, which
          routes through an envoy-gateway Backend and accepts endpoints[].fqdn.
        success_msg: "app_edp: ONTAP S3 data LIF {{ _edp_ontap_s3_lif }}:{{ _edp_ontap_s3_port }}"
        quiet: true
      when: _edp_ontap_s3_tls_mode != 'insecure'

    # Reaching this means an explicit edp_storage_type outranked the derivation (extra
    # vars beat set_fact), or the endpoint came from ontap_data_lif via an explicit
    # edp_ontap_s3_reverse_proxy, which the derivation deliberately does not act on.
    - name: "app_edp | ONTAP S3 | Assert EDP uses the s3compatible storage backend"
      ansible.builtin.assert:
        that: edp_storage_type | default('seaweedfs') == 's3compatible'
        fail_msg: >-
          The ONTAP S3 reverse proxy is active but edp_storage_type is
          '{{ edp_storage_type }}'. ONTAP S3 is reached through 's3compatible': it is the
          only branch of app_edp/templates/values.yaml.j2 that emits edpInternalUrl and
          edpExternalUrl separately. Clear edp_storage_type to let it be derived, set it
          to s3compatible, or set edp_ontap_s3_reverse_proxy: false.
        success_msg: "app_edp: ONTAP S3 storage type OK"
        quiet: true

    - name: "app_edp | ONTAP S3 | Assert vector DB RBAC is disabled"
      ansible.builtin.assert:
        that: not (edp_rbac_enabled | default(false) | bool)
        fail_msg: >-
          edp_rbac_enabled is true but the object store is ONTAP S3. RBAC mode makes EDP
          sign requests as the logged-in user: it emits useBearerTokenAuth and calls STS
          AssumeRoleWithWebIdentity through minio's WebIdentityProvider
          (src/edp/app/utils.py:47-58, src/edp/app/main.py:257-275). ONTAP S3 implements
          neither, so every upload fails. Set edp_rbac_enabled: false.
        success_msg: "app_edp: ONTAP S3 requires edp_rbac_enabled false - OK"
        quiet: true

    - name: "app_edp | ONTAP S3 | Assert ONTAP S3 credentials are present"
      ansible.builtin.assert:
        that:
          - edp_s3_compatible_access_key_id | default('', true) | string | trim | length > 0
          - edp_s3_compatible_secret_access_key | default('', true) | string | trim | length > 0
        fail_msg: >-
          ONTAP S3 needs edp_s3_compatible_access_key_id and
          edp_s3_compatible_secret_access_key. They are the access keys of the ONTAP S3
          user and cannot be derived; create them on the SVM with
          'vserver object-store-server user create'.
        success_msg: "app_edp: ONTAP S3 credentials present"
        quiet: true
      # Projected Secrets: the keys are read from the store (erag/user/edp-s3,
      # whose ensure in install.yaml fails naming the path), not config.
      when: not (app_secrets_projected | default(false))

    - name: "app_edp | ONTAP S3 | Assert the CA certificate file exists"
      ansible.builtin.assert:
        that:
          - ontap_s3_ca_cert_file | default('', true) | string | trim | length > 0
          - ontap_s3_ca_cert_file is exists
        fail_msg: >-
          edp_ontap_s3_tls_mode is 'ca' but ontap_s3_ca_cert_file
          ('{{ ontap_s3_ca_cert_file | default('') }}') does not exist on the installer host.
          Provide the PEM that signed the ONTAP S3 server certificate, or use
          edp_ontap_s3_tls_mode: insecure.
        success_msg: "app_edp: ONTAP S3 CA certificate found"
        quiet: true
      when: _edp_ontap_s3_tls_mode == 'ca'

    # The rendered HTTPRoute match and the prefix utils.py re-injects after signing
    # have to be the same string, and Gateway API rejects a PathPrefix that is not
    # rooted, so an empty prefix would leave the route matching everything on the
    # apex hostname.
    - name: "app_edp | ONTAP S3 | Assert the S3 path prefix is rooted"
      ansible.builtin.assert:
        that: _edp_s3_prefix is match('^/[^/]')
        fail_msg: >-
          The S3 path prefix resolves to '{{ _edp_s3_prefix }}'. With routing_mode 'path'
          it becomes the HTTPRoute PathPrefix and the prefix src/edp/app/utils.py
          re-injects into every presigned URL, so it must start with a single '/' and name
          a segment. Set edp_s3_path_prefix (or edp_default_s3_path_prefix) to something
          like '/s3'.
        success_msg: "app_edp: ONTAP S3 path prefix {{ _edp_s3_prefix }}"
        quiet: true
      when: _edp_s3_path_mode | bool

    - name: "app_edp | ONTAP S3 | Derive the in-cluster endpoint URL"
      ansible.builtin.set_fact:
        edp_s3_compatible_internal_url: >-
          {{ ('https' if _edp_ontap_s3_tls_mode != 'plaintext' else 'http')
             ~ '://' ~ _edp_ontap_s3_lif ~ ':' ~ _edp_ontap_s3_port }}
      when: edp_s3_compatible_internal_url | default('', true) | trim in ['', 'https://s3.example.com']

    - name: "app_edp | ONTAP S3 | Derive the browser-facing endpoint URL"
      ansible.builtin.set_fact:
        edp_s3_compatible_external_url: >-
          {{ 'https://' ~ _edp_s3_host ~ (_edp_s3_prefix if _edp_s3_path_mode | bool else '') }}
      when: edp_s3_compatible_external_url | default('', true) | trim in ['', 'https://s3.example.com']

    # ONTAP presents a self-signed certificate issued to the SVM (internal leg), and the
    # platform gateway one from the installer's own CA, which the EDP container does not
    # mount today (external leg). An operator who fixes either can override these.
    - name: "app_edp | ONTAP S3 | Apply the certificate verification policy"
      ansible.builtin.set_fact:
        edp_s3_compatible_internal_cert_verify: false
        edp_s3_compatible_external_cert_verify: false

    # ONTAP S3 has no bucket notifications, so anything uploaded outside the UI is only
    # ingested by the periodic sync.
    - name: "app_edp | ONTAP S3 | Enable the scheduled sync"
      ansible.builtin.set_fact:
        edp_scheduled_sync_enabled: true

    - name: "app_edp | ONTAP S3 | Report the derived configuration"
      ansible.builtin.debug:
        msg: >-
          ONTAP S3: {{ _edp_ontap_s3_lif }}:{{ _edp_ontap_s3_port }}
          ({{ _edp_ontap_s3_tls_mode }} upstream TLS)
          -> {{ edp_s3_compatible_external_url }};
          internal {{ edp_s3_compatible_internal_url }};
          storage type {{ edp_storage_type }}
