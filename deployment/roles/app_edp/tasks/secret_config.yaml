---
# The non-secret keys of edp-access-secret and edp-aws-access-secrets exactly as
# the chart renders them, for the credential registry (value_from
# edp_secret_config.<KEY>) when the port projects those Secrets. Built from the
# chart values.yaml merged with this role's values.yaml.j2, rendered in memory
# without any credential value; the strings follow the chart (Helm quote:
# booleans in lower case, null as empty). Holds no secret.
# Sets: edp_secret_config, edp_secret_storage (the storage type the values use).

# Projected Secrets cannot yet carry the SeaweedFS IAM configuration: it merges
# the object-store identities (from OpenBao) with the STS signing key this role
# generates on every run.
- name: "app_edp | Fail on SeaweedFS RBAC with projected Secrets"
  ansible.builtin.fail:
    msg: >-
      app_edp: edp_rbac_enabled (SeaweedFS IAM configuration with Keycloak STS) is
      not supported yet when Secrets are projected from OpenBao; set
      edp_rbac_enabled: false, or use the local secrets backend
  when:
    - app_secrets_projected | default(false)
    - edp_rbac_enabled | default(false) | bool
    - edp_storage_type == 'seaweedfs'

- name: "app_edp | Resolve the non-secret settings of the EDP Secrets"
  ansible.builtin.set_fact:
    edp_secret_storage: "{{ lookup('env', 'edp_storage_type') or edp_storage_type if edp_storage_type is defined else 'seaweedfs' }}"
    edp_secret_config: "{{ _cfg }}"
  vars:
    _v: >-
      {{ (lookup('ansible.builtin.file', edp_helm_default_values_file) | from_yaml)
         | combine(lookup('ansible.builtin.template', 'values.yaml.j2', template_vars={'app_secrets_projected': true}) | from_yaml,
                   recursive=true) }}
    _cfg: >-
      {%- set out = {} -%}
      {%- for key, name in {'EDP_INTERNAL_URL': 'edpInternalUrl', 'EDP_INTERNAL_CERT_VERIFY': 'edpInternalCertVerify',
                            'EDP_EXTERNAL_URL': 'edpExternalUrl', 'EDP_EXTERNAL_CERT_VERIFY': 'edpExternalCertVerify',
                            'EDP_BASE_REGION': 'edpBaseRegion', 'EDP_OIDC_CONFIG_URL': 'edpOidcConfigUrl',
                            'SHAREPOINT_TENANT_ID': 'sharepointTenantId', 'SHAREPOINT_CLIENT_ID': 'sharepointClientId',
                            'KEYCLOAK_BROKER_IDP_ALIAS': 'keycloakBrokerIdpAlias',
                            'AWS_SQS_EVENT_QUEUE_URL': 'edpSqsEventQueueUrl'}.items() -%}
        {%- set v = _v[name] | default(none) -%}
        {%- set _ = out.update({key: ('' if v is none else ((v | string | lower) if v is boolean else (v | string)))}) -%}
      {%- endfor -%}
      {#- print "https://" .Values.minioBrowserDomain (.Values.seaweedfsPathPrefix | default "") "/oauth_callback" -#}
      {%- set domain = _v.minioBrowserDomain | default(none) -%}
      {%- set _ = out.update({'EDP_OIDC_REDIRECT_URI': 'https://' ~ ('<nil>' if domain is none else domain | string)
                              ~ (_v.seaweedfsPathPrefix | default('', true) | string) ~ '/oauth_callback'}) -%}
      {{ out }}
