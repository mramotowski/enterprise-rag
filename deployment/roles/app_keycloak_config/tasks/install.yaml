---
# Configure an already-deployed Keycloak (deployed by core/keycloak via Operator).
# Uses Job-based configuration (configure_keycloak.yaml) — NOT realmImport — so
# realms/clients/users can be reconfigured on upgrades without recreating the
# Keycloak instance.

- name: "app_keycloak_config | Assert external OIDC configuration is complete"
  ansible.builtin.include_tasks: assert_oidc_config.yaml

- name: "app_keycloak_config | Warn that SharePoint is inactive"
  ansible.builtin.debug:
    msg: >-
      SharePoint integration will be inactive: set erag_keycloak_oidc_tenant_id
      to enable SharePoint ingestion. Single Sign-On login is unaffected.
  when:
    - erag_keycloak_oidc_endpoint | default('', true) | string | trim | length > 0
    - erag_keycloak_oidc_tenant_id | default('', true) | string | trim | length == 0

- name: "app_keycloak_config | Verify Keycloak admin secret exists in {{ keycloak_namespace }}"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ keycloak_admin_secret_name }}"
    namespace: "{{ keycloak_namespace }}"
  register: _kc_admin_secret
  failed_when: _kc_admin_secret.resources | length == 0

- name: "app_keycloak_config | Mark admin secret for password management"
  ansible.builtin.include_role:
    name: app_secrets
    tasks_from: ensure.yaml
  vars:
    secret_ids: [platform/keycloak-admin]
    ensure_phase: after_deploy

- name: "app_keycloak_config | Run Keycloak configurator Job"
  ansible.builtin.include_tasks: configure_keycloak.yaml
