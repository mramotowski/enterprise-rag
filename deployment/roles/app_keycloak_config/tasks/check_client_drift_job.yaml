---
# Client secret drift check with projected Secrets (ARCHITECTURE-SPINE AD-3, AD-11):
# files/check_client_drift.py runs as a Job (app_script_job) in the Keycloak namespace,
# reads the admin credentials and the projected client secrets as secretKeyRef env and
# prints one verdict per client. Included from check_client_drift.yaml.

# Its own task: resolves the Jinja in the registry secrets: keys (as projections.yaml).
- name: "app_keycloak_config | Drift Job | Resolve the registry Secret keys"
  ansible.builtin.set_fact:
    _kc_drift_secrets: "{{ app_secrets_registry.secrets | dict2items }}"
    _kc_drift_script: "{{ role_path }}/files/check_client_drift.py"

# Every registry client rotated with keycloak-client-secret-set, with the enabled Secret
# key in the Keycloak namespace it is projected to (the first one); env: the Job variable.
- name: "app_keycloak_config | Drift Job | Set the clients to compare"
  ansible.builtin.set_fact:
    _kc_drift_clients: >-
      {%- set out = [] -%}
      {%- set seen = [] -%}
      {%- for cid, c in app_secrets_registry.credentials.items()
            if (c.rotate | default({})).hook | default('') == 'keycloak-client-secret-set' -%}
        {%- for s in _kc_drift_secrets
              if s.key.split('/', 1)[0] == keycloak_namespace and s.value.enabled | default(true) | bool -%}
          {%- for key, d in s.value.data.items()
                if d['from'] | default('') == cid ~ '.' ~ c.rotate['keys'][0] and d.enabled | default(true) | bool
                   and cid not in seen -%}
            {%- set _ = seen.append(cid) -%}
            {%- set _ = out.append({'client_id': c.rotate.target.client_id, 'realm': c.rotate.target.realm,
                                    'env': 'PROJECTED_' ~ cid.split('/')[1] | upper | replace('-', '_'),
                                    'secret': s.key.split('/', 1)[1], 'key': key, 'id': cid}) -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ out }}

- name: "app_keycloak_config | Drift Job | Report rotated clients that are not checked"
  ansible.builtin.debug:
    msg: >-
      Keycloak clients not checked for drift (no enabled projection of their secret in
      {{ keycloak_namespace }}): {{ _unchecked | join(', ') }}
  vars:
    _unchecked: >-
      {{ app_secrets_registry.credentials | dict2items
         | selectattr('value.rotate.hook', 'defined') | selectattr('value.rotate.hook', 'equalto', 'keycloak-client-secret-set')
         | map(attribute='key') | reject('in', _kc_drift_clients | map(attribute='id') | list) | list }}
  when: _unchecked | length > 0

- name: "app_keycloak_config | Drift Job | Run the check"
  ansible.builtin.include_role:
    name: app_script_job
    tasks_from: run.yaml
  vars:
    script_job_prefix: keycloak-client-drift
    script_job_namespace: "{{ keycloak_namespace }}"
    script_job_part_of: erag-keycloak-config
    script_job_component: client-drift-check
    script_job_managed_by: app_keycloak_config
    script_job_script: "{{ _kc_drift_script }}"
    script_job_image: "{{ keycloak_drift_job_image }}"
    script_job_timeout: "{{ keycloak_drift_job_timeout }}"
    script_job_result_regex: '^[{].*"admin_login": *(true|false)'
    script_job_env: >-
      {%- set plan = [] -%}
      {%- set refs = [{'name': 'KEYCLOAK_ADMIN_PASSWORD', 'secret': keycloak_admin_secret_name, 'key': 'password', 'optional': true}] -%}
      {%- for c in _kc_drift_clients -%}
        {%- set _ = plan.append({'client_id': c.client_id, 'realm': c.realm, 'env': c.env}) -%}
        {%- set _ = refs.append({'name': c.env, 'secret': c.secret, 'key': c.key, 'optional': true}) -%}
      {%- endfor -%}
      {{ [{'name': 'KEYCLOAK_URL', 'value': keycloak_drift_keycloak_url | trim},
          {'name': 'KEYCLOAK_ADMIN_USER', 'value': keycloak_admin_user | string},
          {'name': 'DRIFT_TIMEOUT', 'value': '15'},
          {'name': 'DRIFT_CLIENTS', 'value': plan | to_json}] + refs }}

- name: "app_keycloak_config | Drift Job | Report the result"
  vars:
    _res: "{{ script_job_result }}"
    _states: "{{ _res.clients | default({}) }}"
    _by_client: "{{ _kc_drift_clients | items2dict(key_name='client_id', value_name='key') }}"
    _ids: "{{ _kc_drift_clients | items2dict(key_name='client_id', value_name='id') }}"
    _drifted: "{{ _states | dict2items | selectattr('value', 'equalto', 'drift') | map(attribute='key') | list }}"
  block:
    - name: "app_keycloak_config | Report a drift Job that gave no result"
      ansible.builtin.debug:
        msg: >-
          WARNING: Keycloak client secret drift check NOT done: Job
          {{ keycloak_namespace }}/{{ script_job_name }} {{ script_job_reason or 'printed no result line' }}
          (image {{ keycloak_drift_job_image }}). The image must be pullable in the
          cluster; the Job never logs a secret.
      when: _res.admin_login is not defined or _res.error | default(false) | bool

    - name: "app_keycloak_config | Report a failed Keycloak admin login"
      ansible.builtin.debug:
        msg: >-
          WARNING: Keycloak client secret drift check NOT done: the admin login at
          {{ keycloak_drift_keycloak_url }} (realm master, admin-cli) with Secret
          '{{ keycloak_namespace }}/{{ keycloak_admin_secret_name }}' failed, so the
          client secrets in Keycloak could not be read.
      when:
        - _res.admin_login is defined
        - not (_res.admin_login | bool)
        - not (_res.error | default(false) | bool)

    - name: "app_keycloak_config | Report clients the drift check could not compare"
      ansible.builtin.debug:
        msg: >-
          Keycloak client '{{ item.key }}' not compared: {{ _why[item.value] | default(item.value) }}
      vars:
        _why:
          no_projection: >-
            no projected value (key '{{ _by_client[item.key] | default('?') }}' is missing from
            its Secret in {{ keycloak_namespace }}; check that its ExternalSecret is synced).
          not_in_keycloak: "the client does not exist in its realm."
          error: "the Keycloak admin API call failed."
      loop: "{{ _states | dict2items | rejectattr('value', 'in', ['match', 'drift']) | list }}"
      loop_control:
        label: "{{ item.key }}"

    - name: "app_keycloak_config | Assert Keycloak client secrets match OpenBao"
      ansible.builtin.assert:
        that: _drifted | length == 0
        fail_msg: >-
          Keycloak holds another client secret than OpenBao for: {{ _drifted | join(', ') }}
          (e.g. regenerated in the Keycloak admin console). Services using these clients
          fail to authenticate although the projections are SecretSynced. Run install erag
          (or rotate the id: {{ _drifted | map('extract', _ids) | join(', ') }}) to re-apply
          the OpenBao value.
        success_msg: >-
          app_keycloak_config client secrets: {{ _states | dict2items | selectattr('value', 'equalto', 'match')
          | map(attribute='key') | join(', ') or 'none compared' }} match OpenBao
        quiet: true
      when:
        - _res.admin_login | default(false) | bool
        - not (_res.error | default(false) | bool)
