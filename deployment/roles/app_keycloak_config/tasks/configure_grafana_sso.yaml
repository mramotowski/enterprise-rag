---
# Inject the Grafana <-> Keycloak SSO connection into the platform Grafana.
# Skipped automatically when the platform Grafana is not deployed.

- name: "app_keycloak_config | grafana-sso | Look up platform Grafana Deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ grafana_oauth_deployment }}"
    namespace: "{{ grafana_oauth_namespace }}"
  register: _grafana_deploy
  failed_when: false

- name: "app_keycloak_config | grafana-sso | Configure SSO on platform Grafana"
  when: (_grafana_deploy.resources | default([])) | length > 0
  block:
    - name: "app_keycloak_config | grafana-sso | Build Grafana OAuth env"
      ansible.builtin.set_fact:
        _grafana_sso_env:
          GF_SERVER_ROOT_URL: "https://{{ grafana_oauth_domain }}{{ grafana_oauth_path_prefix }}/"
          GF_SERVER_DOMAIN: "{{ grafana_oauth_domain }}"
          GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
          GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak"
          GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
          GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana-oauth"
          GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ grafana_oauth_client_secret }}"
          GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile offline_access roles"
          GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: "email"
          GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: "preferred_username"
          GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: "full_name"
          GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://{{ erag_keycloak_domain_name }}{{ erag_keycloak_path_prefix }}/realms/{{ grafana_oauth_realm }}/protocol/openid-connect/auth"
          GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "{{ grafana_oauth_keycloak_internal_url }}/realms/{{ grafana_oauth_realm }}/protocol/openid-connect/token"
          GF_AUTH_GENERIC_OAUTH_API_URL: "{{ grafana_oauth_keycloak_internal_url }}/realms/{{ grafana_oauth_realm }}/protocol/openid-connect/userinfo"
          GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || ''"
          GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
          GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
          GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: "https://{{ erag_keycloak_domain_name }}{{ erag_keycloak_path_prefix }}/realms/{{ grafana_oauth_realm }}/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2F{{ grafana_oauth_domain }}{{ grafana_oauth_path_prefix }}%2Flogin"
      no_log: "{{ secure_logs | default(true) }}"

    # Projected Secrets: grafana-sso-env is an ESO projection (registry), whose
    # non-secret keys come from this fact; the client secret stays in the store
    # (grafana_oauth_client_secret is empty in this mode).
    - name: "app_keycloak_config | grafana-sso | Set the non-secret Grafana OAuth settings"
      ansible.builtin.set_fact:
        grafana_sso_config: >-
          {{ _grafana_sso_env | dict2items
             | rejectattr('key', 'equalto', 'GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET') | items2dict }}
      when: app_secrets_projected | default(false)

    - name: "app_keycloak_config | grafana-sso | Project grafana-sso-env"
      ansible.builtin.include_role:
        name: app_secrets
        tasks_from: ensure.yaml
      vars:
        secret_ids: [keycloak/grafana-oauth]
      when: app_secrets_projected | default(false)

    - name: "app_keycloak_config | grafana-sso | Create/update grafana-sso-env Secret"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ grafana_oauth_secret_name }}"
            namespace: "{{ grafana_oauth_namespace }}"
            labels:
              app.kubernetes.io/managed-by: ansible
              app.kubernetes.io/component: grafana-sso
          type: Opaque
          stringData: "{{ _grafana_sso_env }}"
      when: not (app_secrets_projected | default(false))
      no_log: "{{ secure_logs | default(true) }}"

    - name: "app_keycloak_config | grafana-sso | Wire Secret into Grafana + roll"
      kubernetes.core.k8s:
        state: patched
        merge_type: strategic-merge
        api_version: apps/v1
        kind: Deployment
        name: "{{ grafana_oauth_deployment }}"
        namespace: "{{ grafana_oauth_namespace }}"
        definition:
          spec:
            template:
              metadata:
                annotations:
                  # Projected: over the non-secret settings only (the value stays in the store).
                  erag.intel.com/grafana-sso-config-hash: >-
                    {{ (grafana_sso_config if app_secrets_projected | default(false) else _grafana_sso_env)
                       | to_json | hash('sha1') }}
              spec:
                initContainers:
                  - name: init-chown-data
                    $patch: delete
                containers:
                  - name: grafana
                    envFrom:
                      - secretRef:
                          name: "{{ grafana_oauth_secret_name }}"
                          optional: true

- name: "app_keycloak_config | grafana-sso | Skip (platform Grafana not found)"
  ansible.builtin.debug:
    msg: >-
      Grafana Deployment '{{ grafana_oauth_deployment }}' not found in namespace
      '{{ grafana_oauth_namespace }}' - skipping SSO injection.
  when: (_grafana_deploy.resources | default([])) | length == 0
