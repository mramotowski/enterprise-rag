#
# One case of test_switch_guard.yaml (item: name, state, confirmed, expect_fail).
# A case passes when the guard refused exactly when expected and nothing else
# failed. After the guard the case loads the local credentials as
# app_pre_install does (app_generate_password): a refused case must leave no
# default_credentials.yaml behind, any other case must have written it.

---
- name: "app_secrets | test | switch-back guard | {{ item.name }} | Write the cluster state"
  ansible.builtin.copy:
    dest: "{{ _tmp.path }}/{{ item.name }}.json"
    content: "{{ item.state | to_json }}"
    mode: "0600"

- name: "app_secrets | test | switch-back guard | {{ item.name }} | Guard"
  block:
    - name: "app_secrets | test | switch-back guard | {{ item.name }} | Run the switch-back guard"
      ansible.builtin.include_role:
        name: app_secrets
        tasks_from: switch_guard.yaml
        apply:
          environment:
            # Empty: the fake k8s_info fails, as on an unreadable cluster.
            FAKE_K8S_STATE: "{{ '' if item.unreadable | default(false) else _tmp.path ~ '/' ~ item.name ~ '.json' }}"
      vars:
        erag_secrets_switch_to_local_confirmed: "{{ item.confirmed }}"

    - name: "app_secrets | test | switch-back guard | {{ item.name }} | Create the log dir"
      ansible.builtin.file:
        path: "{{ _tmp.path }}/{{ item.name }}/rag"
        state: directory
        mode: "0700"

    - name: "app_secrets | test | switch-back guard | {{ item.name }} | Load init passwords"
      ansible.builtin.include_role:
        name: app_generate_password
      vars:
        log_dir: "{{ _tmp.path }}/{{ item.name }}"

    - name: "app_secrets | test | switch-back guard | {{ item.name }} | Record a pass"
      ansible.builtin.set_fact:
        _switch_results: "{{ _switch_results | default([]) + [{'name': item.name, 'failed': false, 'ok': not item.expect_fail}] }}"
  rescue:
    - name: "app_secrets | test | switch-back guard | {{ item.name }} | Record a failure"
      ansible.builtin.set_fact:
        _switch_results: >-
          {{ _switch_results | default([]) + [{'name': item.name, 'failed': true,
             'msg': ansible_failed_result.msg | default('') | truncate(160),
             'guard': _guard,
             'ok': _guard and item.expect_fail}] }}
      vars:
        # Only the guard's refusal counts: any other failure (or a refusal
        # where none is expected) fails the case. The guard's message is not
        # under no_log.
        _guard: >-
          {{ (ansible_failed_result.msg | default('')) is search('secrets_backend is local')
             and (ansible_failed_result.msg | default('')) is search('erag_secrets_switch_to_local_confirmed') }}

- name: "app_secrets | test | switch-back guard | {{ item.name }} | Look for the credential file"
  ansible.builtin.stat:
    path: "{{ _tmp.path }}/{{ item.name }}/rag/default_credentials.yaml"
  register: _gen

# A refused case must leave no file; a passing one must have written it.
- name: "app_secrets | test | switch-back guard | {{ item.name }} | Mark a case whose credential file is wrong"
  ansible.builtin.set_fact:
    _switch_results: >-
      {{ _switch_results[:-1] + [_switch_results[-1] | combine({'ok': false, 'file_written': _gen.stat.exists})] }}
  when: (_gen.stat.exists | bool) == (item.expect_fail | bool)
