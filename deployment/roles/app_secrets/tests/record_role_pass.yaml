#
# Helper for test_role_calls.yaml: record the credential files, the fake
# cluster state and the credential facts of this host as role_pass.

---
- name: "app_secrets | test | Read the files of this host"
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ rag_log_dir }}/default_credentials.yaml"
    - "{{ rag_log_dir }}/default_credentials.txt"
    - "{{ fake_k8s_state }}"
  register: _role_files
  no_log: true

- name: "app_secrets | test | Stat the credential files"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ rag_log_dir }}/default_credentials.yaml"
    - "{{ rag_log_dir }}/default_credentials.txt"
  register: _role_stats

- name: "app_secrets | test | Record this host"
  ansible.builtin.set_fact:
    role_pass:
      yaml: "{{ _role_files.results[0].content | b64decode }}"
      txt: "{{ _role_files.results[1].content | b64decode }}"
      cluster: "{{ _role_files.results[2].content | b64decode | from_json }}"
      cluster_raw: "{{ _role_files.results[2].content | b64decode }}"
      modes: "{{ _role_stats.results | map(attribute='stat.mode') | list }}"
      facts: "{{ _facts }}"
  vars:
    _facts: >-
      {%- set out = {} -%}
      {%- for n in fact_names -%}
        {%- set _ = out.update({n: lookup('ansible.builtin.vars', n, default='<undefined>')}) -%}
      {%- endfor -%}
      {{ out }}
  no_log: true
