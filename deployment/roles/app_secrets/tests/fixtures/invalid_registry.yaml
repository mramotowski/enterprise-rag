# Invalid registry for test_port_contract.yaml: every entry except
# chat-history/postgres (and workloads ok) breaks one validation rule.

credentials:
  chat-history/postgres:
    owner_role: app_chat_history
    path: erag/chat-history/postgres
    keys:
      password: {generate: {type: password, length: 32, special: false}}
    legacy:
      - {kv_key: password, secret: {namespace: chat-history, name: mongo-database-secret, key: POSTGRES_PASSWORD, markup: true}}
    rotate: {none: true, reason: test}

  Bad_Id/x:
    owner_role: app_chat_history
    path: erag/bad/x
    keys: {}
    legacy: []
    rotate: {none: true, reason: test}

  bad/no-rotate:
    owner_role: app_chat_history
    path: erag/bad/no-rotate
    keys: {}
    legacy: []

  bad/hook:
    owner_role: app_chat_history
    path: erag/bad/hook
    keys: {password: {generate: {type: password, length: 16}}}
    legacy: []
    rotate: {hook: vector-db-password-change, keys: [password], target: {}, restart: []}

  bad/restart:
    owner_role: app_chat_history
    path: erag/bad/restart
    keys: {password: {generate: {type: password, length: 16}}}
    legacy: []
    rotate: {hook: redis-acl-set, keys: [password], target: {host: h, port: 1, user: u}, restart: [model-pods]}

  bad/keys:
    owner_role: app_chat_history
    path: erag/bad/keys
    keys: {token: {generate: {type: static}}}
    legacy: []
    rotate: {hook: redis-acl-set, keys: [token], target: {host: h, port: 1, user: u}, restart: []}

  bad/target:
    owner_role: app_chat_history
    path: erag/bad/target
    keys: {password: {generate: {type: password, length: 16}}}
    legacy: []
    rotate: {hook: postgres-alter-user, keys: [password], target: {host: h, port: 1}, restart: [ok]}

  bad/operator:
    owner_role: app_chat_history
    path: erag/bad/operator
    keys: {token: {generate: {type: static}}}
    legacy: []
    rotate: {hook: operator-write, restart: []}

workloads:
  ok:
    - {namespace: ns, kind: Deployment, name: d}
  bad-kind:
    - {namespace: ns, kind: Pod, name: p}

secrets: {}
