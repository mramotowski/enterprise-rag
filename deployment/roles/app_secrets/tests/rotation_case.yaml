#
# Helper for rotation_cases.yaml: one app_secrets rotate with the openbao
# backend; records {ok, msg, results, worker, runs, force_sync} in
# rcases[case.name] (msg on failure only; runs = the number of Jobs this case
# ran; force_sync = the force-sync annotation of each ExternalSecret after it).
# Expects: case = {name, ids, env, timeout, inject: {flag: n}}, the play vars of
# rotation_cases.yaml.

---
- name: "app_secrets | test | rotation | {{ case.name }} reset results"
  ansible.builtin.set_fact:
    app_secrets_rotate_results: {}
    app_secrets_worker_result: {}
    _runs_before: "{{ _runs | length }}"

- name: "app_secrets | test | rotation | {{ case.name }} inject failures"
  ansible.builtin.command:
    argv: "{{ harness.split(' ') + ['fakes-set', obdir, 'inject.' ~ item.key, item.value | string] }}"
  loop: "{{ case.inject | default({}) | dict2items }}"
  changed_when: true

- name: "app_secrets | test | rotation | {{ case.name }}"
  block:
    - name: "app_secrets | test | rotation | {{ case.name }} via the port"
      ansible.builtin.include_role:
        name: app_secrets
        tasks_from: rotate.yaml
        apply:
          environment: "{{ case.env | default({}) }}"
      vars:
        secrets_backend: openbao
        secret_ids: "{{ case.ids }}"
        app_secrets_openbao_address: "{{ test_addr }}"
        app_secrets_rotate_rollout_timeout: "{{ case.timeout | default(10) }}"

    - name: "app_secrets | test | rotation | {{ case.name }} succeeded"
      ansible.builtin.set_fact:
        _case_result: {ok: true, msg: ""}
  rescue:
    - name: "app_secrets | test | rotation | {{ case.name }} failed"
      ansible.builtin.set_fact:
        _case_result: {ok: false, msg: "{{ ansible_failed_result.msg | default('') }}"}

- name: "app_secrets | test | rotation | {{ case.name }} reset injected failures"
  ansible.builtin.command:
    argv: "{{ harness.split(' ') + ['fakes-set', obdir, 'inject.' ~ item.key, '0'] }}"
  loop: "{{ case.inject | default({}) | dict2items }}"
  changed_when: true

- name: "app_secrets | test | rotation | {{ case.name }} record"
  ansible.builtin.set_fact:
    rcases: >-
      {{ rcases | combine({case.name: _case_result | combine({
           'results': app_secrets_rotate_results | default({}),
           'worker': app_secrets_worker_result | default({}),
           'runs': (_runs | length) - (_runs_before | int),
           'force_sync': _stamps})}) }}
  vars:
    # The force-sync annotation of every ExternalSecret after the case (no value).
    _stamps: >-
      {%- set out = {} -%}
      {%- for k in _st.keys() | select('match', '^ExternalSecret/') -%}
        {%- set _ = out.update({k: (_st[k].metadata.annotations | default({}, true))['external-secrets.io/force-sync'] | default('')}) -%}
      {%- endfor -%}
      {{ out }}
