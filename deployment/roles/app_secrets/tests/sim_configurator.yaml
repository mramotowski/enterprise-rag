#
# Helper for test_role_calls.yaml: stands in for the keycloak configurator Job,
# which creates erag-credentials (users and the MCP client) on its first run.

---
- name: "app_secrets | test | sim | Configurator Job writes erag-credentials"
  ansible.builtin.include_tasks: sim_release.yaml
  vars:
    sim_label: erag-credentials
    sim_secrets:
      - namespace: "{{ keycloak_namespace }}"
        name: erag-credentials
        only_if_absent: true
        data:
          KEYCLOAK_ERAG_ADMIN_USERNAME: erag-admin
          KEYCLOAK_ERAG_ADMIN_PASSWORD: "{{ lookup('ansible.builtin.password', '/dev/null length=12 chars=ascii_letters,digits') }}"
          KEYCLOAK_ERAG_USER_USERNAME: erag-user
          KEYCLOAK_ERAG_USER_PASSWORD: "{{ lookup('ansible.builtin.password', '/dev/null length=12 chars=ascii_letters,digits') }}"
          KEYCLOAK_ERAG_MAINTAINER_USERNAME: erag-maintainer
          KEYCLOAK_ERAG_MAINTAINER_PASSWORD: "{{ lookup('ansible.builtin.password', '/dev/null length=12 chars=ascii_letters,digits') }}"
          MCP_CLIENT_ID: mcp-client
          MCP_CLIENT_SECRET: "{{ lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits') }}"
