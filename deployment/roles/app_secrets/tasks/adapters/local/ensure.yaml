#
# Local adapter: ensure.
#   before_deploy (default):
#     file_password / file_key credentials go through app_generate_password
#     with the same loop items the component roles used, so the file lines,
#     their order, the mode and the facts are the same. Unlike the old role
#     calls, no_log is always on (secure_logs: true).
#     role_managed credentials with local.generator get a fresh value from
#     the legacy generator in the generator's facts (generators.yaml); the
#     owning role only calls ensure when its Secret lacks the value.
#     Other role_managed and user_supplied credentials are no-ops.
#   after_deploy: after_deploy.yaml (mark Secrets, refresh files).

---
- name: "app_secrets | ensure | Run the after_deploy phase"
  ansible.builtin.include_tasks: after_deploy.yaml
  when: ensure_phase | default('before_deploy') == 'after_deploy'

- name: "app_secrets | ensure | Run the before_deploy phase"
  when: ensure_phase | default('before_deploy') == 'before_deploy'
  block:
    - name: "app_secrets | ensure | Map file credentials"
      ansible.builtin.include_tasks: file_items.yaml
      vars:
        app_secrets_op: ensure

    - name: "app_secrets | ensure | Report legacy items skipped by skip_if_defined"
      ansible.builtin.debug:
        msg: "{{ item.id }} {{ item.file_var }}: skipped, {{ item.skip_if_defined }} already defined"
      loop: "{{ app_secrets_local_skipped_items }}"
      loop_control:
        label: "{{ item.id }} {{ item.file_var }}"

    - name: "app_secrets | ensure | Skip credentials not generated by the local adapter"
      ansible.builtin.debug:
        msg: >-
          {{ item }}: local.mechanism {{ app_secrets_catalog[item].local.mechanism }},
          handled by {{ app_secrets_catalog[item].owner_role }} in local mode (no-op)
      loop: "{{ app_secrets_selected_ids | select('in', _skipped) | list }}"
      vars:
        _skipped: >-
          {{ app_secrets_catalog | dict2items
             | selectattr('value.local.mechanism', 'in', ['role_managed', 'user_supplied'])
             | rejectattr('value.local.generator', 'defined')
             | map(attribute='key') | list }}

    - name: "app_secrets | ensure | Generate or load file credentials"
      ansible.builtin.include_role:
        name: app_generate_password
        tasks_from: "{{ 'generate_key' if item.mechanism == 'file_key' else 'generate_password' }}.yaml"
        apply:
          no_log: true
      vars:
        password_file: "{{ app_secrets_local_password_file_path }}"
        secure_logs: true
      loop: "{{ app_secrets_local_file_items }}"
      loop_control:
        label: "{{ item.id }} {{ item.name }}"
      no_log: true

    - name: "app_secrets | ensure | Run role_managed generators"
      ansible.builtin.include_tasks: generators.yaml
      loop: >-
        {{ app_secrets_selected_ids
           | select('in', app_secrets_catalog | dict2items
                          | selectattr('value.local.generator', 'defined')
                          | map(attribute='key') | list)
           | list }}
      loop_control:
        loop_var: app_secrets_generator_id
