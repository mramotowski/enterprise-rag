#
# openbao adapter: the worker plan from the registry (no values), see
# files/secrets_job.py: {mount, entries: [{action, id, path, keys}]} with
#   write  for app_secrets_plan_write_ids
#   check  for app_secrets_plan_check_ids; keys only with
#          app_secrets_plan_check_keys (the Job then also checks that an
#          existing entry has every registry key)
# keys: {<kv_key>: spec}, spec {type: password, length, special} | {type: hex,
# bytes} | {type: nkey_user, writes: [seed_key, public_key_key]} | {type:
# static}. Keys with generated_by are filled by another key's generator and get
# no spec.
# Expects: app_secrets_op, app_secrets_plan_write_ids, app_secrets_plan_check_ids,
# app_secrets_plan_check_keys (optional, default false).
# Sets: app_secrets_worker_plan.

---
- name: "app_secrets | {{ app_secrets_op }} | openbao | Fail on unknown generator types"
  ansible.builtin.fail:
    msg: >-
      app_secrets | {{ app_secrets_op }} | unsupported generator in the registry:
      {{ _bad | join('; ') }}. Valid types: password (length, special), hex (bytes),
      nkey_user (writes [seed, public_key]), static.
  vars:
    _bad: >-
      {%- set bad = [] -%}
      {%- for cid in app_secrets_plan_write_ids -%}
        {%- for k, spec in app_secrets_catalog[cid]['keys'].items() if spec.generated_by is not defined -%}
          {%- set g = spec.generate | default({}) -%}
          {%- set t = g.type | default('') -%}
          {%- if t not in ['password', 'hex', 'nkey_user', 'static']
                 or (t == 'password' and not ((g.length | default('') | string) is match('^[0-9]+$')))
                 or (t == 'hex' and not ((g.bytes | default('') | string) is match('^[0-9]+$')))
                 or (t == 'nkey_user' and (g.writes | default([]) | length) != 2) -%}
            {%- set _ = bad.append(cid ~ '.' ~ k ~ ' (' ~ (t or 'no generate.type') ~ ')') -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ bad }}
  when: _bad | length > 0

- name: "app_secrets | {{ app_secrets_op }} | openbao | Build the worker plan"
  ansible.builtin.set_fact:
    app_secrets_worker_plan:
      mount: "{{ app_secrets_openbao_kv_mount }}"
      entries: >-
        {%- set out = [] -%}
        {%- for cid in app_secrets_plan_write_ids -%}
          {%- set _ = out.append({'action': 'write', 'id': cid, 'keys': _specs[cid],
                                  'path': app_secrets_openbao_cluster_id ~ '/' ~ app_secrets_catalog[cid].path}) -%}
        {%- endfor -%}
        {%- for cid in app_secrets_plan_check_ids -%}
          {%- set _ = out.append({'action': 'check', 'id': cid,
                                  'keys': _specs[cid] if app_secrets_plan_check_keys | default(false) | bool else {},
                                  'path': app_secrets_openbao_cluster_id ~ '/' ~ app_secrets_catalog[cid].path}) -%}
        {%- endfor -%}
        {{ out }}
  vars:
    # {<id>: {<kv_key>: <spec>}} for every planned credential.
    _specs: >-
      {%- set out = {} -%}
      {%- for cid in (app_secrets_plan_write_ids + app_secrets_plan_check_ids) | unique -%}
        {%- set specs = {} -%}
        {%- for k, spec in app_secrets_catalog[cid]['keys'].items() if spec.generated_by is not defined -%}
          {%- set g = spec.generate | default({}) -%}
          {%- if g.type | default('') == 'password' -%}
            {%- set _ = specs.update({k: {'type': 'password', 'length': g.length | int, 'special': g.special | default(false) | bool}}) -%}
          {%- elif g.type | default('') == 'hex' -%}
            {%- set _ = specs.update({k: {'type': 'hex', 'bytes': g.bytes | int}}) -%}
          {%- elif g.type | default('') == 'nkey_user' -%}
            {%- set _ = specs.update({k: {'type': 'nkey_user', 'writes': g.writes[:2]}}) -%}
          {%- else -%}
            {%- set _ = specs.update({k: {'type': 'static'}}) -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set _ = out.update({cid: specs}) -%}
      {%- endfor -%}
      {{ out }}
  no_log: true
