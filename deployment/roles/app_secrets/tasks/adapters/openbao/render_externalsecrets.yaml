#
# openbao adapter: one ExternalSecret per projection (templates/externalsecret.yaml.j2):
#   - target = the registry Secret name and namespace, exactly its data keys,
#     through target.template (from = the KV value, identifier = the literal
#     registry identifier, value = the literal, value_from = the literal from
#     the fact the owning role set, template = the registry template text);
#   - a template source may be embedded in other text only when its value is
#     URL- and JSON-safe by construction (password without special
#     characters, hex, nkey); others (static, special passwords) must be the
#     whole text, so no escaping is ever needed;
#   - data[] = the KV keys read, remoteRef {key: <cluster_id>/<path>, property};
#   - the target namespace gets the label secrets.ai-solutions/<layer>: "true"
#     (ClusterSecretStore namespaceSelector) and the annotation
#     secrets.ai-solutions/<layer>-paths: the registry paths of every credential
#     any registry projection into that namespace reads (the platform admission
#     policy admits only those keys); then the ExternalSecret is applied and
#     must become Ready.
# Expects: app_secrets_render_projections (from projections.yaml).

---
- name: "app_secrets | ensure | openbao | Fail on projections that cannot be rendered"
  ansible.builtin.fail:
    msg: "app_secrets | ensure | cannot render ExternalSecrets: {{ _problems | join('; ') }}"
  vars:
    _templates: "{{ app_secrets_registry.templates | default({}, true) }}"
    _problems: >-
      {%- set bad = [] -%}
      {%- for p in app_secrets_render_projections -%}
        {%- for t in p.undefined_templates -%}
          {%- set _ = bad.append(p.key ~ ': template ' ~ t ~ ' is not defined in the registry templates: map') -%}
        {%- endfor -%}
        {%- for d in p.data | dict2items -%}
          {%- set texts = [] -%}
          {%- if d.value.identifier is defined -%}
            {%- set cid = d.value.identifier.split('.', 1)[0] -%}
            {%- set name = d.value.identifier.split('.', 1)[1] | default('') -%}
            {%- if (app_secrets_catalog[cid] | default({})).identifiers[name] is not defined -%}
              {%- set _ = bad.append(p.key ~ ' ' ~ d.key ~ ': identifier ' ~ d.value.identifier ~ ' is not defined') -%}
            {%- else -%}
              {%- set _ = texts.append(app_secrets_catalog[cid].identifiers[name] | string) -%}
            {%- endif -%}
          {%- elif d.value.value is defined -%}
            {%- set _ = texts.append(d.value.value | string) -%}
          {%- elif d.value.value_from is defined -%}
            {%- set vf = (d.value.value_from | string).split('.', 1) -%}
            {%- set fact = lookup('ansible.builtin.vars', vf[0], default='') -%}
            {%- if vf | length != 2 or fact is not mapping or vf[1] not in fact -%}
              {%- set msg = p.key ~ ': value_from ' ~ ((vf[0] ~ ' is not set (the role that owns the Secret sets this fact before ensure)')
                                                      if fact is not mapping else (d.value.value_from ~ ' is not set')) -%}
              {%- if msg not in bad -%}
                {%- set _ = bad.append(msg) -%}
              {%- endif -%}
            {%- else -%}
              {%- set _ = texts.append(fact[vf[1]] | string) -%}
            {%- endif -%}
          {%- elif d.value.template is defined and d.value.template in _templates -%}
            {%- set text = _templates[d.value.template] | string -%}
            {%- set _ = texts.append(text) -%}
            {%- for n in text | regex_findall('[$][{]([0-9]+)[}]') | unique -%}
              {%- if (n | int) >= (d.value.sources | length) -%}
                {%- set _ = bad.append(p.key ~ ' ' ~ d.key ~ ': template ' ~ d.value.template ~ ' uses ${' ~ n ~ '}, but there are only ' ~ (d.value.sources | length) ~ ' sources') -%}
              {%- elif text != ('${' ~ n ~ '}') -%}
                {#- Embedded in other text: the value must need no escaping. -#}
                {%- set ref = d.value.sources[n | int] -%}
                {%- set ckeys = app_secrets_catalog[ref | regex_replace('[.][^.]*$', '')]['keys'] -%}
                {%- set spec = ckeys[ref | regex_replace('^.*[.]', '')] -%}
                {#- A key filled by another key's generator is as safe as that generator. -#}
                {%- set g = (ckeys[spec.generated_by] if spec.generated_by is defined else spec).generate | default({}) -%}
                {%- if not (g.type | default('') in ['hex', 'nkey_user']
                            or (g.type | default('') == 'password' and not (g.special | default(false) | bool))) -%}
                  {%- set _ = bad.append(p.key ~ ' ' ~ d.key ~ ': template ' ~ d.value.template ~ ' embeds ' ~ ref
                                         ~ ', which may need escaping (' ~ (g.type | default('?')) ~ (' with special characters' if g.special | default(false) | bool else '')
                                         ~ '); such a source may only be the whole template text') -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- elif d.value['from'] is not defined and d.value.template is not defined -%}
            {%- set _ = bad.append(p.key ~ ' ' ~ d.key ~ ': source must be from, identifier, value, value_from or template') -%}
          {%- endif -%}
          {%- for text in texts if ('{' ~ '{') in text or ('}' ~ '}') in text or '@@SK:' in text -%}
            {%- set _ = bad.append(p.key ~ ' ' ~ d.key ~ ': literal text must not contain Go template delimiters or @@SK:') -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ bad }}
  when: _problems | length > 0

- name: "app_secrets | ensure | openbao | Build the ExternalSecrets"
  ansible.builtin.set_fact:
    _app_secrets_es_render: "{{ _render }}"
  vars:
    _templates: "{{ app_secrets_registry.templates | default({}, true) }}"
    _cid: "{{ app_secrets_openbao_cluster_id }}"
    _render: >-
      {%- set out = [] -%}
      {%- for p in app_secrets_render_projections -%}
        {%- set tmpl = {} -%}
        {%- set data = {} -%}
        {%- for d in p.data | dict2items -%}
          {%- set refs = [] -%}
          {%- if d.value['from'] is defined -%}
            {%- set _ = refs.append(d.value['from']) -%}
            {%- set text = '@@SK:' ~ (d.value['from'] | regex_replace('[^a-z0-9.]', '_') | replace('.', '__')) ~ '@@' -%}
          {%- elif d.value.identifier is defined -%}
            {%- set ip = d.value.identifier.split('.', 1) -%}
            {%- set text = app_secrets_catalog[ip[0]].identifiers[ip[1]] | string -%}
          {%- elif d.value.value is defined -%}
            {%- set text = d.value.value | string -%}
          {%- elif d.value.value_from is defined -%}
            {%- set vf = (d.value.value_from | string).split('.', 1) -%}
            {%- set text = lookup('ansible.builtin.vars', vf[0])[vf[1]] | string -%}
          {%- else -%}
            {%- set ns = namespace(text=_templates[d.value.template] | string) -%}
            {%- for n in ns.text | regex_findall('[$][{]([0-9]+)[}]') | unique -%}
              {%- set ref = d.value.sources[n | int] -%}
              {%- set _ = refs.append(ref) -%}
              {%- set ns.text = ns.text | replace('${' ~ n ~ '}', '@@SK:' ~ (ref | regex_replace('[^a-z0-9.]', '_') | replace('.', '__')) ~ '@@') -%}
            {%- endfor -%}
            {%- set text = ns.text -%}
          {%- endif -%}
          {%- set _ = tmpl.update({d.key: text}) -%}
          {%- for ref in refs -%}
            {%- set cid = ref | regex_replace('[.][^.]*$', '') -%}
            {%- set _ = data.update({(ref | regex_replace('[^a-z0-9.]', '_') | replace('.', '__')):
                                     {'key': _cid ~ '/' ~ app_secrets_catalog[cid].path,
                                      'property': ref | regex_replace('^.*[.]', '')}}) -%}
          {%- endfor -%}
        {%- endfor -%}
        {%- set dl = [] -%}
        {%- for i in data | dict2items | sort(attribute='key') -%}
          {%- set _ = dl.append({'secretKey': i.key} | combine(i.value)) -%}
        {%- endfor -%}
        {%- set _ = out.append({'name': p.name, 'namespace': p.namespace, 'ids': p.cids,
                                'template': tmpl, 'data': dl}) -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: "app_secrets | ensure | openbao | Create, label and annotate the target namespaces"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
        labels: "{{ {app_secrets_namespace_label: 'true'} }}"
        # From the whole registry (every projection, variant and key into the
        # namespace, enabled or not; projections.yaml), so each ensure writes
        # the same value.
        annotations: "{{ {app_secrets_paths_annotation: app_secrets_namespace_paths[item] | join(',')} }}"
  loop: "{{ _app_secrets_es_render | map(attribute='namespace') | unique | list }}"
  no_log: true

- name: "app_secrets | ensure | openbao | Apply the ExternalSecrets"
  block:
    - name: "app_secrets | ensure | openbao | Create a private render directory"
      ansible.builtin.tempfile:
        state: directory
        prefix: app_secrets_es_
      register: _app_secrets_es_dir
      no_log: true

    # Rendered to a file and applied with src: the Go template actions in
    # target.template must never pass through Ansible variable templating.
    # The file holds KV references and literals only.
    - name: "app_secrets | ensure | openbao | Render the ExternalSecrets"
      ansible.builtin.template:
        src: externalsecret.yaml.j2
        dest: "{{ _app_secrets_es_dir.path }}/externalsecrets.yaml"
        mode: "0600"
      no_log: true

    # apply: a re-render (e.g. another vector store engine or storage type)
    # must drop the target.template keys the new spec no longer has, which a
    # merge patch would keep.
    - name: "app_secrets | ensure | openbao | Apply the ExternalSecrets"
      kubernetes.core.k8s:
        state: present
        apply: true
        src: "{{ _app_secrets_es_dir.path }}/externalsecrets.yaml"
      no_log: true

  always:
    - name: "app_secrets | ensure | openbao | Remove the render directory"
      ansible.builtin.file:
        path: "{{ _app_secrets_es_dir.path }}"
        state: absent
      when: _app_secrets_es_dir.path is defined
      no_log: true

- name: "app_secrets | ensure | openbao | Wait for the ExternalSecrets to be Ready"
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ExternalSecret
    name: "{{ item.name }}"
    namespace: "{{ item.namespace }}"
  register: _app_secrets_es_status
  until: >-
    (_app_secrets_es_status.resources | default([]) | length > 0) and
    (((_app_secrets_es_status.resources[0].status | default({})).conditions | default([])
      | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length) > 0)
  retries: "{{ app_secrets_eso_wait_retries | int }}"
  delay: "{{ app_secrets_eso_wait_delay | int }}"
  loop: "{{ _app_secrets_es_render }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.name }}"
  failed_when: false
  no_log: true

- name: "app_secrets | ensure | openbao | Fail on ExternalSecrets that are not Ready"
  ansible.builtin.fail:
    msg: "app_secrets | ensure | ExternalSecrets not Ready: {{ _bad | join('; ') }}"
  vars:
    _bad: >-
      {%- set bad = [] -%}
      {%- for r in _app_secrets_es_status.results -%}
        {%- set res = r.resources | default([]) -%}
        {%- set ready = ((res | first | default({})).status | default({})).conditions | default([])
                        | selectattr('type', 'equalto', 'Ready') | first | default({}) -%}
        {%- if (ready.status | default('') | string) != 'True' -%}
          {%- set _ = bad.append(r.item.namespace ~ '/' ~ r.item.name ~ ' ('
                                 ~ ((ready.reason | default('no Ready condition')) ~ ': ' ~ (ready.message | default(''))
                                    if res | length > 0 else 'not found') ~ ')') -%}
        {%- endif -%}
      {%- endfor -%}
      {{ bad }}
  when: _bad | length > 0

- name: "app_secrets | ensure | openbao | Report the ExternalSecrets"
  ansible.builtin.debug:
    msg: "{{ item.namespace }}/{{ item.name }}: ExternalSecret Ready ({{ item.ids | join(', ') }})"
  loop: "{{ _app_secrets_es_render }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.name }}"
