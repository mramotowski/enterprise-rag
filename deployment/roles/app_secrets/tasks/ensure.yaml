#
# Port operation 'ensure'. Usage:
#   - ansible.builtin.include_role:
#       name: app_secrets
#       tasks_from: ensure.yaml
#     vars:
#       secret_ids: [<component>/<credential>, ...]
#       ensure_phase: before_deploy   # default; call before the consuming release
#                                     # (local: generate/load, run role_managed generators)
#       # ensure_phase: after_deploy  # call after the release created its Secrets
#                                     # (local: mark them, refresh files; IDs may
#                                     # include platform/* entries)

---
- name: "app_secrets | ensure | Validate request"
  ansible.builtin.include_tasks: common/validate.yaml
  vars:
    app_secrets_op: ensure

- name: "app_secrets | ensure | Run {{ secrets_backend }} adapter"
  ansible.builtin.include_tasks: "adapters/{{ secrets_backend }}/ensure.yaml"
