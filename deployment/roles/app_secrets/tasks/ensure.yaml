#
# Port operation 'ensure'. Usage:
#   - ansible.builtin.include_role:
#       name: app_secrets
#       tasks_from: ensure.yaml
#     vars:
#       secret_ids: [<component>/<credential>, ...]
#
# Call before the consuming release.
# openbao only (common/validate.yaml): in local mode the roles call
# app_generate_password / app_password_mgmt themselves.

---
- name: "app_secrets | ensure | Validate request"
  ansible.builtin.include_tasks: common/validate.yaml
  vars:
    app_secrets_op: ensure

- name: "app_secrets | ensure | Run the openbao adapter"
  ansible.builtin.include_tasks: adapters/openbao/ensure.yaml
