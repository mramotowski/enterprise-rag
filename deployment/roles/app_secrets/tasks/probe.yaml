#
# Port operation 'probe'. Usage:
#   - ansible.builtin.include_role:
#       name: app_secrets
#       tasks_from: probe.yaml
#     vars:
#       secret_ids: [<component>/<credential>, ...]   # optional: default every credential ID
#       app_secrets_probe_teardown: true   # optional: the teardown gate (default false):
#                                          # skips the ClusterSecretStore check (the
#                                          # delete does not need ESO)
#
# openbao only (common/validate.yaml). The local-mode switch-back guard is
# switch_guard.yaml.

---
- name: "app_secrets | probe | Validate request"
  ansible.builtin.include_tasks: common/validate.yaml
  vars:
    app_secrets_op: probe

- name: "app_secrets | probe | Run the openbao adapter"
  ansible.builtin.include_tasks: adapters/openbao/probe.yaml
