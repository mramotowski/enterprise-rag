# Port operation 'probe'. Usage:
#   - ansible.builtin.include_role:
#       name: app_secrets
#       tasks_from: probe.yaml
#     vars:
#       secret_ids: [<component>/<credential>, ...]   # optional: default every credential ID
#       app_secrets_probe_teardown: true   # optional: the teardown gate (default false):
#                                          # openbao skips the ClusterSecretStore check (the
#                                          # delete does not need ESO); local probes nothing

---
- name: "app_secrets | probe | Validate request"
  ansible.builtin.include_tasks: common/validate.yaml
  vars:
    app_secrets_op: probe

# Teardown gate: the local store has nothing remote to check (its probe would
# create the password file).
- name: "app_secrets | probe | Run {{ secrets_backend }} adapter"
  ansible.builtin.include_tasks: "adapters/{{ secrets_backend }}/probe.yaml"
  when: not (app_secrets_probe_teardown | default(false) | bool and secrets_backend == 'local')
