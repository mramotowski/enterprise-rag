#
# Port operation 'rotate'. Usage:
#   - ansible.builtin.include_role:
#       name: app_secrets
#       tasks_from: rotate.yaml
#     vars:
#       secret_ids: [<component>/<credential>, ...]

---
- name: "app_secrets | rotate | Validate request"
  ansible.builtin.include_tasks: common/validate.yaml
  vars:
    app_secrets_op: rotate

- name: "app_secrets | rotate | Run {{ secrets_backend }} adapter"
  ansible.builtin.include_tasks: "adapters/{{ secrets_backend }}/rotate.yaml"
