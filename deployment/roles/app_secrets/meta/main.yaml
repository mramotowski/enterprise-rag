---
galaxy_info:
  role_name: app_secrets
  author: Intel Corporation
  description: >-
    Credential port. Takes credential IDs from the registry
    (files/registry.yaml) and runs one operation on them. preflight runs in
    both modes (local and openbao); the other ops (probe | ensure | status |
    delete | import | rotate) need secrets_backend openbao (the openbao
    adapter). Helper role: include it with tasks_from and vars
    {secret_ids: [...]} (optional for probe, preflight and import: default
    every credential ID), not as a component.
  license: Apache-2.0
  min_ansible_version: "2.14"
dependencies: []
