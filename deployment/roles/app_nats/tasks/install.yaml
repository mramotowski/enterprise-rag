---
- name: "app_nats | Set role facts"
  ansible.builtin.set_fact:
    nats_helm_override_values_path: >-
      {{ rag_tmp_dir }}/{{ nats_helm_release_name }}-override-values.yaml

- name: "app_nats | Ensure namespace exists"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ nats_namespace }}"

- name: "app_nats | Label namespace — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ nats_namespace }}"
        labels:
          istio.io/dataplane-mode: "ambient"
          erag-istio-protected: "true"
  when: istio_enabled | default(false) | bool

- name: "app_nats | Label namespace — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ nats_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "restricted"
          pod-security.kubernetes.io/audit: "restricted"
          pod-security.kubernetes.io/warn: "restricted"
  when: enforce_pss | default(false) | bool

# The auth secret carries the client NKey pair. It is generated once and reused
# on upgrades so existing pods keep authenticating; a secret left incomplete or
# empty by an earlier failed run is regenerated.
- name: "app_nats | Check for existing auth secret"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ nats_auth_secret_name }}"
    namespace: "{{ nats_namespace }}"
  register: _nats_auth_secret

# With projected Secrets the port's ensure creates the pair once in OpenBao and
# renders nats-auth and its consumer copies (ESO); the role writes no Secret.
- name: "app_nats | Generate and store NKey material"
  when:
    # Regenerate when the secret is absent, or when it exists but any required
    # key is missing or empty. A complete secret leaves this False (no churn).
    - (app_secrets_projected | default(false))
      or (_nats_auth_secret.resources | default([]) | length == 0)
      or (nats_auth_required_keys | difference(
            _nats_auth_secret.resources[0].data | default({})
            | dict2items | rejectattr('value', 'equalto', '')
            | map(attribute='key') | list) | length > 0)
  block:
    # Sets nats_auth_nkey_seed and nats_auth_nkey_public.
    - name: "app_nats | Generate client NKey pair"
      ansible.builtin.include_role:
        name: app_secrets
        tasks_from: ensure.yaml
      vars:
        secret_ids: [nats/auth]

    - name: "app_nats | Create auth secret"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ nats_auth_secret_name }}"
            namespace: "{{ nats_namespace }}"
          data:
            user.nk: "{{ nats_auth_nkey_seed | b64encode }}"
            user.pub: "{{ nats_auth_nkey_public | b64encode }}"
      no_log: "{{ secure_logs }}"
      when: not (app_secrets_projected | default(false))

# The controller and router read the same NKey seed to authenticate to NATS, so
# the secret is mirrored into their namespaces.
- name: "app_nats | Mirror client NKey to consumer namespaces"
  when: not (app_secrets_projected | default(false))
  block:
    - name: "app_nats | Read auth secret for mirroring"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ nats_auth_secret_name }}"
        namespace: "{{ nats_namespace }}"
      register: _nats_auth_secret_full
      no_log: "{{ secure_logs }}"

    - name: "app_nats | Ensure consumer namespaces exist"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item }}"
      loop: "{{ nats_client_namespaces }}"

    - name: "app_nats | Create client auth secret in consumer namespaces"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ nats_auth_secret_name }}"
            namespace: "{{ item }}"
          data:
            user.nk: "{{ _nats_auth_secret_full.resources[0].data['user.nk'] }}"
      no_log: "{{ secure_logs }}"
      loop: "{{ nats_client_namespaces }}"

- name: "app_nats | Generate override values file from template"
  ansible.builtin.template:
    src: "values.yaml.j2"
    dest: "{{ nats_helm_override_values_path }}"
    mode: '0644'

- name: "app_nats | Set values_files list"
  ansible.builtin.set_fact:
    values_files: >
      {{
        [nats_helm_default_values_file] +
        [nats_helm_override_values_path]
      }}

- name: "app_nats | Install or Upgrade Helm chart"
  kubernetes.core.helm:
    name: "{{ nats_helm_release_name }}"
    chart_ref: "{{ nats_helm_chart_directory }}"
    namespace: "{{ nats_namespace }}"
    values_files: "{{ values_files }}"
    state: present
    create_namespace: true
    timeout: "{{ helm_timeout }}"
  register: helm_repo_install_result
  until: helm_repo_install_result is succeeded
  retries: "{{ helm_retries }}"
  delay: 15
