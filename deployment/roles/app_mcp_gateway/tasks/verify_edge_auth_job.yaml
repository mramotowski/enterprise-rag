---
# Edge auth check with projected Secrets (AD-3, AD-11): files/verify_edge_auth.py runs as
# a Job (app_script_job) next to the agent client Secret, read as secretKeyRef env.
# hostAliases send the Keycloak and UI hostnames to the Envoy gateway Service, so the
# requests take an agent's path. Included from verify_edge_auth.yaml.

- name: "app_mcp_gateway | Edge auth Job | Find the gateway data-plane Service"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: "{{ envoy_gateway_namespace }}"
    label_selectors:
      - "gateway.envoyproxy.io/owning-gateway-name={{ gateway_name }}"
      - "gateway.envoyproxy.io/owning-gateway-namespace={{ gateway_namespace }}"
  register: _mcp_edge_auth_svc

- name: "app_mcp_gateway | Edge auth Job | Set the gateway data-plane address"
  ansible.builtin.set_fact:
    _mcp_edge_auth_ip: >-
      {{ _mcp_edge_auth_svc.resources | default([]) | map(attribute='spec')
         | map(attribute='clusterIP', default='') | reject('in', ['', 'None'])
         | first | default('') }}

- name: "app_mcp_gateway | Edge auth Job | Report a gateway Service that was not found"
  ansible.builtin.debug:
    msg: >-
      Skipping the MCP edge auth check: no Envoy Gateway data-plane Service with a
      ClusterIP in '{{ envoy_gateway_namespace }}' for Gateway
      '{{ gateway_namespace }}/{{ gateway_name }}', so the in-cluster check cannot reach
      the edge.
  when: _mcp_edge_auth_ip | length == 0

- name: "app_mcp_gateway | Edge auth Job | Run the check"
  when: _mcp_edge_auth_ip | length > 0
  vars:
    _job: "{{ keycloak_namespace }}/{{ script_job_name }}"
  block:
    - name: "app_mcp_gateway | Edge auth Job | Set the script and timeout"
      ansible.builtin.set_fact:
        _mcp_edge_auth_script: "{{ role_path }}/files/verify_edge_auth.py"
        # Token request (15s), every probe (10s each) and the waits between them, plus
        # time for the image pull and pod start.
        _mcp_edge_auth_job_timeout: >-
          {{ 15 + (mcp_edge_auth_retries | int + 1) * 10
             + mcp_edge_auth_retries | int * mcp_edge_auth_delay | int + 180 }}

    - name: "app_mcp_gateway | Note that early 401s are expected"
      ansible.builtin.debug:
        msg: >-
          Probing {{ mcp_resource_url }} with an agent token from a Job in
          {{ keycloak_namespace }} through the gateway at {{ _mcp_edge_auth_ip }}. The Job
          retries 401s until the gateway picks up the realm's signing keys (up to
          {{ mcp_jwks_cache_duration }} after the route is programmed), for at most
          {{ _mcp_edge_auth_job_timeout }}s.

    - name: "app_mcp_gateway | Edge auth Job | Probe the edge"
      ansible.builtin.include_role:
        name: app_script_job
        tasks_from: run.yaml
      vars:
        script_job_prefix: mcp-edge-auth
        script_job_namespace: "{{ keycloak_namespace }}"
        script_job_part_of: erag-mcp-gateway
        script_job_component: edge-auth-check
        script_job_managed_by: app_mcp_gateway
        script_job_script: "{{ _mcp_edge_auth_script }}"
        script_job_image: "{{ mcp_edge_auth_job_image }}"
        script_job_timeout: "{{ _mcp_edge_auth_job_timeout }}"
        script_job_result_regex: '^[{].*"edge_http": *-?[0-9]+'
        script_job_host_aliases:
          - ip: "{{ _mcp_edge_auth_ip }}"
            hostnames: "{{ [mcp_jwt_issuer | trim | urlsplit('hostname'), mcp_resource_url | trim | urlsplit('hostname')] | unique }}"
        script_job_env:
          - {name: MCP_TOKEN_URL, value: "{{ mcp_jwt_issuer | trim ~ '/protocol/openid-connect/token' }}"}
          - {name: MCP_RESOURCE_URL, value: "{{ mcp_resource_url | trim ~ '/' }}"}
          - {name: MCP_EDGE_AUTH_RETRIES, value: "{{ mcp_edge_auth_retries | int }}"}
          - {name: MCP_EDGE_AUTH_DELAY, value: "{{ mcp_edge_auth_delay | int }}"}
          # optional: a missing key starts the pod, so the script reports it.
          - {name: MCP_CLIENT_ID, secret: "{{ credentials_secret_name }}", key: MCP_CLIENT_ID, optional: true}
          - {name: MCP_CLIENT_SECRET, secret: "{{ credentials_secret_name }}", key: MCP_CLIENT_SECRET, optional: true}

    - name: "app_mcp_gateway | Report an edge auth Job that gave no result"
      ansible.builtin.debug:
        msg: >-
          Skipping the MCP edge auth check: Job {{ _job }}
          {{ script_job_reason or 'printed no result line' }} (image {{ mcp_edge_auth_job_image }}),
          so the edge was not probed. The image must be pullable in the cluster; the Job never
          logs the credentials or the token.
      when: script_job_result.edge_http is not defined or script_job_result.error | default(false) | bool

    - name: "app_mcp_gateway | Edge auth Job | Verdict"
      ansible.builtin.include_tasks: edge_auth_verdict.yaml
      vars:
        _edge_auth: "{{ script_job_result }}"
        _edge_auth_fix: >-
          It is projected from OpenBao: check
          'kubectl -n {{ keycloak_namespace }} get externalsecret {{ credentials_secret_name }}'
          (synced?) and that the OpenBao entry erag/keycloak/mcp-client exists; the keys
          are projected only with mcp_enabled: true (re-run install erag).
        _edge_auth_token_where: " through the gateway at {{ _mcp_edge_auth_ip }}, from Job {{ _job }}."
        _edge_auth_edge_where: "through the gateway at {{ _mcp_edge_auth_ip }} from Job {{ _job }}."
        _edge_auth_attempts: " ({{ script_job_result.attempts | default(0) }} attempts from Job {{ _job }})"
      when:
        - script_job_result.edge_http is defined
        - not (script_job_result.error | default(false) | bool)
