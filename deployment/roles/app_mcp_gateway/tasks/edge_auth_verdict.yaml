---
# The edge auth verdict of both paths of verify_edge_auth.yaml (host and Job). Vars:
# _edge_auth {credentials, token, token_http, edge_http} (HTTP -1: no response);
# message parts _edge_auth_fix, _edge_auth_token_where, _edge_auth_edge_where and
# _edge_auth_attempts (optional).

- name: "app_mcp_gateway | Assert the agent client credentials exist"
  ansible.builtin.assert:
    that: _edge_auth.credentials | bool
    fail_msg: >-
      Secret '{{ keycloak_namespace }}/{{ credentials_secret_name }}' carries no
      MCP_CLIENT_ID / MCP_CLIENT_SECRET, so no agent can obtain a token for the MCP
      gateway. {{ _edge_auth_fix }}
    success_msg: "app_mcp_gateway agent client: OK"
    quiet: true

- name: "app_mcp_gateway | Report a token endpoint that is not reachable"
  ansible.builtin.debug:
    msg: >-
      Skipping the MCP edge auth check: no token from {{ mcp_jwt_issuer }}
      (HTTP {{ _edge_auth.token_http if _edge_auth.token_http | int > 0 else 'no response' }}){{ _edge_auth_token_where }}
  when: not (_edge_auth.token | bool)

- name: "app_mcp_gateway | Report an edge that is not reachable"
  ansible.builtin.debug:
    msg: >-
      Skipping the MCP edge auth check: {{ mcp_resource_url }} is not reachable
      {{ _edge_auth_edge_where }}
  when:
    - _edge_auth.token | bool
    - _edge_auth.edge_http | int < 0

- name: "app_mcp_gateway | Assert the edge accepts an agent token"
  ansible.builtin.assert:
    that: _edge_auth.edge_http | int not in [401, 403]
    fail_msg: >-
      The edge rejected a freshly issued agent token with
      HTTP {{ _edge_auth.edge_http }} for
      {{ mcp_edge_auth_retries | int * mcp_edge_auth_delay | int }}s{{ _edge_auth_attempts | default('') }},
      which is longer than the JWKS cache. Check
      'kubectl -n {{ envoy_gateway_namespace }} logs -l
      gateway.envoyproxy.io/owning-gateway-name={{ gateway_name }} -c envoy
      | grep -i jwks'; deleting those pods forces a refetch.
    success_msg: "app_mcp_gateway edge auth: agent token accepted"
    quiet: true
  when:
    - _edge_auth.token | bool
    - _edge_auth.edge_http | int > 0
