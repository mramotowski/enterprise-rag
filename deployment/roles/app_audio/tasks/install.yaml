---
- name: "app_audio | Set override_values.yaml path"
  ansible.builtin.set_fact:
    audio_helm_override_values_path: >-
      {{ rag_tmp_dir }}/{{ audio_helm_release_name }}-override-values.yaml

- name: "app_audio | Ensure namespace exists"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ audio_namespace }}"

- name: "app_audio | Label namespace — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ audio_namespace }}"
        labels:
          istio.io/dataplane-mode: "ambient"
          erag-istio-protected: "true"
  when: istio_enabled | default(false) | bool

- name: "app_audio | Label namespace — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ audio_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "restricted"
          pod-security.kubernetes.io/audit: "restricted"
          pod-security.kubernetes.io/warn: "restricted"
  when: enforce_pss | default(false) | bool

# Projected Secrets: the audio pods read audio-hf-token-secret, an ESO
# projection of erag/user/hf-token; it exists only when the operator wrote the
# token (app_pre_install checked it).
- name: "app_audio | Project the HF token into the audio namespace"
  when:
    - app_secrets_projected | default(false)
    - hugging_token_projected | default(false) | bool
  block:
    - name: "app_audio | Enable the audio HF token projection"
      ansible.builtin.set_fact:
        hf_token_secret_audio: true

    - name: "app_audio | Ensure the HF token projection"
      ansible.builtin.include_role:
        name: app_secrets
        tasks_from: ensure.yaml
      vars:
        secret_ids: [user/hf-token]

- name: "app_audio | Generate override values file from template"
  ansible.builtin.template:
    src: "values.yaml.j2"
    dest: "{{ audio_helm_override_values_path }}"
    mode: '0644'

- name: "app_audio | Set fact for Helm values files"
  ansible.builtin.set_fact:
    values_files: >
      {{
        [audio_helm_default_values_file] +
        [audio_helm_override_values_path]
      }}

- name: "app_audio | Install Audio Helm chart"
  kubernetes.core.helm:
    name: "{{ audio_helm_release_name }}"
    chart_ref: "{{ audio_helm_chart_directory }}"
    release_namespace: "{{ audio_namespace }}"
    create_namespace: true
    wait: true
    timeout: "{{ helm_timeout }}"
    values_files: "{{ values_files }}"
  retries: 5
  delay: 15
