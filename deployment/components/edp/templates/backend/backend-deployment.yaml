apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.nameOverride | default (include "helm-edp.fullname" .) }}
  labels:
    {{- include "helm-edp.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "helm-edp.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/access-secret: {{ if .Values.externalSecrets }}{{ pick .Values "edpInternalUrl" "edpInternalCertVerify" "edpExternalUrl" "edpExternalCertVerify" "edpBaseRegion" "edpOidcConfigUrl" "minioBrowserDomain" "seaweedfsPathPrefix" "sharepointTenantId" "sharepointClientId" "keycloakBrokerIdpAlias" | toJson | sha256sum }}{{ else }}{{ include (print $.Template.BasePath "/edp-access-secret.yaml") . | sha256sum }}{{ end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "manifest.podLabels" (list .Values.backend.nameOverride .) | nindent 6 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "helm-edp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgresql
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: postgres:16-alpine
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
          env:
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: edp-postgresql-secret
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: edp-postgresql-secret
                  key: DATABASE_PORT
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: edp-postgresql-secret
                  key: DATABASE_USER
          command:
            - sh
            - -c
            - |
                if [ -z "$DATABASE_HOST" ] || [ -z "$DATABASE_PORT" ] || [ -z "$DATABASE_USERNAME" ]; then
                  echo "Environment variables DATABASE_HOST, DATABASE_PORT, and DATABASE_USERNAME must be set. Skipping wait-for-postgresql init container.";
                  exit 1
                else
                  until pg_isready -h $DATABASE_HOST -p $DATABASE_PORT -U $DATABASE_USERNAME; do
                    echo "Waiting for PostgreSQL server $DATABASE_HOST:$DATABASE_PORT to be ready...";
                    sleep 2;
                  done;
                fi;
        - name: wait-for-redis
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: redis:alpine
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: edp-celery-secrets
                  key: CELERY_BACKEND_URL
            - name: VECTOR_STORE
              valueFrom:
                secretKeyRef:
                  name: vector-database-config
                  key: VECTOR_STORE
          command:
            - sh
            - -c
            - |
                if [ -z "$REDIS_URL" ]; then
                  echo "Environment variable REDIS_URL is not set. Skipping wait-for-redis init container.";
                  exit 1
                else
                  REDIS_CLUSTER_FLAG=$([ "$VECTOR_STORE" = "redis-cluster" ] && echo "-c" || echo "")
                  REDIS_URL_OBFUSCATED=$(echo $REDIS_URL | sed -e 's|//.*:.*@|//********:********@|')
                  until redis-cli $REDIS_CLUSTER_FLAG -u "$REDIS_URL" ping | grep -q PONG; do
                    echo "waiting for redis server $REDIS_URL_OBFUSCATED to be ready...";
                    sleep 2;
                  done;
                fi;
      containers:
        - name: {{ .Values.backend.nameOverride }}
          securityContext:
            {{- toYaml .Values.securityContextWithTemp | nindent 12 }}
          image: {{ .Values.backend.repository }}/{{ .Values.backend.name }}:{{ .Values.backend.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
          env:
          {{- if .Values.proxy.http_proxy }}
            - name: http_proxy
              value: {{ .Values.proxy.http_proxy }}
          {{- end }}
          {{- if .Values.proxy.https_proxy }}
            - name: https_proxy
              value: {{ .Values.proxy.https_proxy }}
          {{- end }}
          {{- if .Values.proxy.no_proxy }}
            - name: no_proxy
              value: {{ include "helm-edp.noProxyWithContainers" . | quote }}
          {{- end }}
          {{- if .Values.backend.environment }}
            {{- toYaml .Values.backend.environment | nindent 12 }}
          {{- end }}
            - name: EDP_SP_SYNC_LOCK_TTL_SECONDS
              value: {{ .Values.sharepointSyncLockTtlSeconds | quote }}
            - name: ERAG_LOGGER_LEVEL
              value: {{ .Values.backend.config.eragLoggerLevel | quote }}
          {{- if .Values.backend.config.rbac.enabled }}
            - name: VECTOR_DB_RBAC
              value: {{ .Values.backend.config.rbac.validationType | quote }}
            - name: VECTOR_DB_RBAC_STATIC_CONFIG
              value: {{ .Values.backend.config.rbac.staticConfig | quote }}
            - name: VECTOR_DB_RBAC_CACHE_EXPIRATION
              value: {{ .Values.backend.config.rbac.cacheExpiration | quote }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: edp-configmap
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- $defaultValues := toYaml .Values.backend.resources | nindent 12 -}}
            {{- include "manifest.getResource" (list .Values.backend.nameOverride $defaultValues .Values) | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
