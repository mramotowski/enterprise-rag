apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chat-history.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "chat-history.name" . }}
    helm.sh/chart: {{ include "chat-history.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "chat-history.selectorLabels" . | nindent 8 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "manifest.podLabels" (list .Values.fullnameOverride .) | nindent 6 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      serviceAccountName: chat-history
      initContainers:
        - name: wait-for-postgresql
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: postgres:17-alpine
          imagePullPolicy: {{ .Values.image.chat_history.pullPolicy }}
          env:
            - name: PGHOST
              value: "{{ .Values.ferretdb.nameOverride }}-postgresql"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: "mongo-database-secret"
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: "mongo-database-secret"
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              value: "postgres"
          command:
            - sh
            - -c
            - |
                echo "Waiting for PostgreSQL server $PGHOST:$PGPORT to be ready...";
                until pg_isready -h $PGHOST -p $PGPORT -U $PGUSER -d $PGDATABASE -t 1; do
                  echo "PostgreSQL is not ready yet, retrying in 2 seconds...";
                  sleep 2;
                done;
                echo "PostgreSQL server is ready and accepting connections!";
        - name: wait-for-ferretdb
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: busybox:1.38
          imagePullPolicy: {{ .Values.image.chat_history.pullPolicy }}
          env:
            - name: FERRETDB_HOST
              value: "{{ .Values.ferretdb.nameOverride }}-ferretdb"
            - name: FERRETDB_PORT
              value: "{{ .Values.ferretdb.service.port }}"
          command:
            - sh
            - -c
            - |
                until nc -z $FERRETDB_HOST $FERRETDB_PORT; do
                  echo "Waiting for FerretDB server $FERRETDB_HOST:$FERRETDB_PORT to be ready...";
                  sleep 2;
                done;
                echo "FerretDB server $FERRETDB_HOST:$FERRETDB_PORT is ready!";
      containers:
        - name: {{ include "chat-history.fullname" . }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: {{ .Values.image.chat_history.repository }}/{{ .Values.image.chat_history.name }}:{{ .Values.image.chat_history.tag }}
          imagePullPolicy: {{ .Values.image.chat_history.pullPolicy }}
          env:
            # legacy MONGO_* envs still used in chat-history-svc
            - name: CHAT_HISTORY_MONGO_HOST
              value: "{{ .Values.ferretdb.nameOverride }}-ferretdb"
            - name: CHAT_HISTORY_MONGO_PORT
              value: "{{ .Values.ferretdb.service.port }}"
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: "mongo-database-secret"
                  key: POSTGRES_USER
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "mongo-database-secret"
                  key: POSTGRES_PASSWORD
          {{- if .Values.proxy.http_proxy }}
            - name: http_proxy
              value: {{ .Values.proxy.http_proxy }}
          {{- end }}
          {{- if .Values.proxy.https_proxy }}
            - name: https_proxy
              value: {{ .Values.proxy.https_proxy }}
          {{- end }}
          {{- if .Values.proxy.no_proxy }}
            - name: no_proxy
              value: {{ .Values.proxy.no_proxy }}
          {{- end }}
          ports:
            - name: http
              containerPort: 6012
          livenessProbe:
            httpGet:
              path: /v1/health_check
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/health_check
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- $defaultValues := toYaml .Values.resources | nindent 12 -}}
            {{- include "manifest.getResource" (list .Values.fullnameOverride $defaultValues .Values) | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
