[project]
name = "Intel-Enterprise-RAG-TTS_FastAPI_Modelserver"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "aiohttp>=3.14.3,<4.0.0",
    "python-dotenv==1.2.4",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "shortuuid==1.0.13",
    "starlette>=1.7.0,<2.0.0",
    "qwen_tts==0.1.1",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "soundfile==0.14.0",
    "pydub==0.25.1",
    "datasets==3.6.0",
    "sentencepiece==0.2.2", # dependency of SpeechT5
    "numba==0.68.0", # dependency of qwen_tts
    "llvmlite==0.50.0", # dependency of qwen_tts
]

[dependency-groups]
security-overrides = [
  "pillow>=12.3.0",
  "protobuf>=7.36.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchaudio = [
    { index = "torchaudio-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torchaudio-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
