[project]
name = "Intel-Enterprise-RAG-Retriever-NER-OVMS"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "optimum-intel==2.2.0",
    "transformers==5.3.0",
    "torch==2.10.0",  
    "nncf==2.19.0",
    "flask==3.1.3",
    "gunicorn==23.0.0",  
    "numpy==1.26.4",
    "scipy==1.18.1",
    "requests==2.34.2",
    "huggingface-hub>=1.33.0,<2.0.0",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.3.0",
  "protobuf>=7.36.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
