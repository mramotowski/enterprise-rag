[project]
name = "Intel-Enterprise-RAG-Text_Extractor_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi==0.142.2",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "numpy==2.5.3",
    "docarray[proto,image]==0.40.0",
    "uvicorn==0.54.0",
    "beautifulsoup4==4.15.0",
    "huggingface_hub>=1.33.0,<2.0.0",
    "filelock ==3.32.7", # dependency of huggingface_hub
    "langchain==1.2.2",
    "langchain-community==0.4.2",
    "marshmallow==3.26.2", # dependency of langchain_community
    "langchain-text-splitters==1.1.3",
    "langsmith==0.14.4",
    "markdown==3.11",
    "nltk==3.10.3",
    "olefile==0.47",
    "pandas==2.3.3",
    "pymupdf==1.28.2",
    "pymupdf4llm==1.28.2",
    "pymupdf-layout==1.28.2",
    "python-bidi==0.6.11",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "pytesseract==0.3.13",
    "regex==2025.11.3",
    "sentence_transformers>=5.7.0,<6.0.0",
    "shortuuid==1.0.13",
    "unstructured[all-docs]==0.27.10",
    "pdfminer-six==20260107", # dependency of all-docs
    "pyasn1==0.6.4", # dependency of unstructured
    "cairosvg==2.9.1",
    "python-magic==0.4.27",
    "python-multipart==0.0.32", # required by FastAPI Form/UploadFile; no longer pulled in by unstructured
    "pathvalidate==3.3.1",
    "langchain-experimental==0.4.2",
    "langchain-huggingface==1.2.2",
    "jinja2==3.1.6",
    "python-dotenv==1.2.4",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "h11==0.16.0",
    "transformers>=5.5.0,<6.0.0",
    "markitdown==0.1.8",
    "setuptools == 80.10.2",     # security update
    "requests ==2.34.2",
    "urllib3>=2.6.3,<3.0.0",
    "opencv-python==4.14.0.94",
    "aiohttp>=3.14.3,<4.0.0",
    "docling==2.94.0",
    "tabulate==0.10.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "fastapi==0.142.2",
    "docarray[proto,image]==0.40.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "setuptools==80.10.2",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.3.0",
  "protobuf>=6.33.6",
  "cryptography==50.0.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "torchvision-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torchvision-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
