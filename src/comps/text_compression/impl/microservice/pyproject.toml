[project]
name = "Intel-Enterprise-RAG-Text_Compression_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "docarray[proto,image] == 0.40.0",
    "fastapi ==0.142.2",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "prometheus-fastapi-instrumentator ==8.1.0",
    "shortuuid == 1.0.13",
    "uvicorn ==0.54.0",
    "python-dotenv ==1.2.4",
    "aiohttp>=3.14.3,<4.0.0",
    "pyyaml ==6.0.3",
    "nltk==3.10.3",
    "requests ==2.34.2",
    "urllib3>=2.6.3,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "fastapi==0.142.2",
    "docarray[proto,image]==0.40.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "opentelemetry-sdk==1.45.0",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.3.0",
  "protobuf>=6.33.6",
]
