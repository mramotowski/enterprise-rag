[project]
name = "Intel-Enterprise-RAG-Embedding-OpenVINO"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "openvino_tokenizers==2025.4.1.0",
    "openvino==2025.4.1",
    "optimum-intel==1.27.0",
    "torch==2.8.0",
    "jinja2 == 3.1.6",
    "MarkupSafe==3.0.4",
    "setuptools == 80.10.2",     # security update
    "requests ==2.34.2",
    "urllib3>=2.6.3,<3.0.0",
    "aiohttp>=3.14.3,<4.0.0",
    "transformers == 4.53.3",
]

[dependency-groups]
security-overrides = [
  "protobuf>=7.36.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
