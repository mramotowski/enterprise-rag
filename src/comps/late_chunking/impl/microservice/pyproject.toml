[project]
name = "Intel-Enterprise-RAG-Late_Chunking_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "aiohttp>=3.14.3,<4.0.0",
    "docarray[proto,image]==0.40.0",
    "fastapi==0.142.2",
    "h11==0.16.0",
    "huggingface-hub==0.36.2",
    "filelock ==3.32.7", # dependency of huggingface_hub
    "jinja2==3.1.6",
    "numpy==2.5.3",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "shortuuid==1.0.13",
    "tokenizers==0.23.2",
    "urllib3>=2.6.3,<3.0.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "fastapi==0.142.2",
    "docarray==0.40.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "opentelemetry-sdk==1.45.0",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.3.0",
  "protobuf>=6.33.6",
]
