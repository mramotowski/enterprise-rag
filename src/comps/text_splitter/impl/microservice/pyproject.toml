[project]
name = "Intel-Enterprise-RAG-Text_Splitter_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi==0.142.2",
    "aiohttp>=3.14.3,<4.0.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "numpy==2.5.3",
    "docarray[proto,image]==0.40.0",
    "uvicorn==0.54.0",
    "langchain==1.2.2",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.3",
    "langsmith==0.14.4",
    "shortuuid==1.0.13",
    "langchain-experimental==0.4.2",
    "jinja2==3.1.6",
    "python-dotenv==1.2.4",
    "h11==0.16.0",
    "requests==2.34.2",
    "urllib3>=2.6.3,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "fastapi==0.142.2",
    "docarray[proto,image]==0.40.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "opentelemetry-sdk==1.45.0",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.3.0",
  "protobuf>=6.33.6",
  "setuptools == 80.10.2",
]
