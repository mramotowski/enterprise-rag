[project]
name = "Intel-Enterprise-RAG-LLM_Guard_Output_Guardrail_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "pip==26.1",
    "docarray[proto,image]==0.40.0",
    "fastapi==0.142.2",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "shortuuid==1.0.13",
    "uvicorn==0.54.0",
    "python-dotenv==1.2.4",
    "h11==0.16.0",
    "requests ==2.34.2",
    "urllib3>=2.6.3,<3.0.0",
    "cryptography>=48.0.1",
    "aiohttp>=3.14.3,<4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "fastapi==0.142.2",
    "docarray[proto,image]==0.40.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "opentelemetry-sdk==1.45.0",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.3.0",
  "protobuf>=6.33.6",
  "setuptools >= 80.10.2",
]

llm-guard = [
  "bc-detect-secrets>=1.5.52,<2.0.0",
  "faker>=40.40.0,<41.0.0",
  "fuzzysearch>=0.8.1,<1.0.0",
  "json-repair>=0.63.5,<1.0.0",
  "nltk>=3.9.4,<4.0.0",
  "presidio-analyzer>=2.2.364,<3.0.0",
  "presidio-anonymizer>=2.2.364,<3.0.0",
  "regex==2026.9.29",
  "structlog>=26.1.0,<27.0.0",
  # Pinned rather than floored: optimum and transformers have to stay mutually
  # compatible and the transformers/torch versions affect scanner inference results.
  "optimum[onnxruntime]==2.3.0",
  "torch==2.11.0",
  "transformers==4.57.3",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
