[project]
name = "Intel-Enterprise-RAG-Namespace_Status_Watcher_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "aiohttp>=3.14.3,<4.0.0",
    "docarray[proto,image]==0.40.0",
    "fastapi==0.142.2",
    "kubernetes==31.0.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "python-dotenv==1.2.4",
    "shortuuid==1.0.13",
    "uvicorn==0.54.0",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.3.0",
  "protobuf>=6.33.6",
  "h11>=0.16.0",
  "cryptography==50.0.2",
]
