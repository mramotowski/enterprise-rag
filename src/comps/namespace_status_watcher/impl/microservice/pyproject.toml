[project]
name = "Intel-Enterprise-RAG-Namespace_Status_Watcher_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "aiohttp>=3.14.3,<4.0.0",
    "docarray[proto,image]==0.41.0",
    "fastapi==0.136.3",
    "kubernetes==31.0.0",
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp==1.39.1",
    "prometheus-fastapi-instrumentator==8.0.0",
    "python-dotenv==1.2.2",
    "shortuuid==1.0.13",
    "uvicorn==0.30.1",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.1.1",
  "protobuf>=6.33.5",
  "h11>=0.16.0",
  "cryptography==50.0.0",
]
