[project]
name = "Intel-Enterprise-RAG-MCP_Gateway"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "uvicorn==0.54.0",
    "starlette>=1.7.0,<2.0.0",
    "httpx==0.28.1",
    "certifi>=2026.7.22",
    "mcp==1.30.0",
    "python-dotenv==1.2.4",
    "h11==0.16.0",
    "anyio==4.9.0",
    "validators==0.35.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "respx==0.23.1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
security-overrides = [
    "urllib3>=2.6.3",
]
